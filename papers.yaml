- title: 'Artifact: A Design Space Exploration of Async/Await (v1.3)'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.21765916
  category: nix-containers
  subcategory: method
  authors:
  - Gavin Gray
  abstract: 'Artifact: A Design Space Exploration of Async/Await This artifact contains
    the models described in Section 4 of the paper "A Design Space Exploration of
    Async/Await". This artifact contains executable Redex semantics for the async/await
    implementations of seven real runtimes --- Python asyncio, Python trio, JavaScript
    (node), C# (.NET), Swift, Rust tokio, and Rust smol --- together with a differential
    fuzzer that tests each model against its real runtime. The artifact and the included
    source files are provided under MIT license. The repository hosting the code,
    including how this artifact is built and distributed, is public online. The artifact
    of record is archived on Zenodo: DOI 10.5281/zenodo.21764829. Getting Started
    The only system requirement for running this artifact is Docker. The Docker image
    is packaged and distributed on Zenodo. The archived record contains one image
    tarball per architecture. Download the one matching your machine --- async-await-<version>-amd64.tar.gz
    for Intel/AMD, or async-await-<version>-arm64.tar.gz for Apple Silicon and other
    ARM --- then load and run it: docker load -i async-await-v1.3-arm64.tar.gz docker
    run --rm -it ghcr.io/gavinleroy/async-await:v1.3-arm64 Memory requirements. Languages
    are run in parallel and you''ll need to provision Docker with enough memory: at
    least 8 GB, 16 GB for the full evaluation. Docker Desktop (macOS/Windows): Settings
    → Resources → Memory. colima: colima start --cpu 4 --memory 16 (the default VM
    is 2 GB, which is not enough). If output shows Killed or LANE DIED, the container
    ran out of memory. The record''s third file, async-await-v1.3-source.tar.gz, is
    the archival copy of the source tree --- you do not need it to run the artifact,
    the image contains all source files. Once inside the artifact environment, the
    Redex models are located under redex/, the figure programs under figs/ --- and
    the three evaluation commands are provided on PATH: run-tests — every model''s
    test suite (each async test also compiles and runs the real program, checked against
    the model output) fuzz — the differential fuzzer, we''ll use this later All seven
    real runtimes (Python 3.14, Node, .NET, Rust, Swift 6) are preinstalled at pinned
    versions; nothing is downloaded at run time. The Docker container is automatically
    generated by the release workflow in the online repository. Although we use Nix
    to automatically generate the provided Docker container, Nix is not officially
    supported as a means of distributing and testing the artifact. This is because
    Swift 6 is not available on nixpkgs (tracked here and here). Kick the Tires (5
    minutes) We will evaluate the stability of your environment by running a few small
    programs with the fuzzer against the model. Run the following: fuzz -n 2 -r 2
    You should see output like the following: fuzz: generating 2 programs x 2 runs
    per lane fuzz: lanes: asyncio javascript trio smol tokio csharp swift fuzz: cache
    dir /home/artifact/repo/artifact/fuzz-cache/20260803T000609Z (details per lane:
    <lang>.log, records: <lang>.jsonl) asyncio [########################] 2/2 done
    0:07 2 ok javascript [########################] 2/2 done 0:04 2 ok trio [########################]
    2/2 done 0:09 2 ok smol [########################] 2/2 done 0:10 2 ok tokio [########################]
    2/2 done 0:12 2 ok csharp [########################] 2/2 done 0:09 2 ok swift
    [########################] 2/2 done 0:17 2 ok lane pass mism unconf crash wall
    asyncio 2 0 0 0 0.1m javascript 2 0 0 0 0.1m trio 2 0 0 0 0.2m smol 2 0 0 0 0.2m
    tokio 2 0 0 0 0.2m csharp 2 0 0 0 0.2m swift 2 0 0 0 0.3m total 14 0 0 0 fuzz:
    results in /home/artifact/repo/artifact/fuzz-cache/20260803T000609Z You should
    not see output that says ERROR or MISMATCH. In the second table printed, if any
    column except pass contains a non-zero value, this could indicate that environment
    is unstable or misconfigured. If that happens, there will be an output line such
    as: smol: failure details in /home/artifact/repo/artifact/fuzz-cache/20260722T215342Z/smol.log
    This could indicate that the environment is setup incorrectly. So please let me
    know, including your architecture, and the contents of the printed log file. Evaluation
    (45 minutes) The full evaluation follows the claims in the paper: we run fifty
    random programs in each language against our models. In the kick-the-tires you
    ran 2 programs. Specifically, for 50 generated programs, running the real-world
    program 50 times produces an I/O output that the model can generate. Run the command:
    fuzz -n 50 After about 45 to 60 minutes, you should see an output like the following:
    lane pass mism unconf crash wall asyncio 50 0 0 0 16.4m javascript 50 0 0 0 8.0m
    trio 50 0 0 0 15.6m smol 50 0 0 0 16.0m tokio 50 0 0 0 13.1m csharp 50 0 0 0 11.6m
    swift 50 0 0 0 34.3m total 350 0 0 0 A note on what''s happening For each of the
    7 runtimes, the fuzzer generates (a) a random type-correct program in the model
    language, and (b) compiles that program into the respective real-world program.
    The real program is run 50 times and each output observed is checked that it''s
    in the set of model outputs. This command will take quite a while to complete,
    not only because it''s running real-world programs with sleeps, it also runs the
    Redex model that models fine-grained concurrency and thread interleaving. The
    entire set of model outputs is not generated, instead, we lazily search through
    the model space for the real outputs observed. (Generating the full model search
    space is infeasible.) In some rare circumstances you may see a case in the unconf
    column, which means the exhaustiveness checker ran out of fuel. I have seen this
    occur infrequently. Of course, the full artifact is the actual Redex models as
    written, which you can find in the redex/ directory, as well as published on the
    Racket Package Index. Racket Package Index The Redex models are additionally distributed
    on the Racket Package Index. Using them to build your own language semantics would
    look like the following: raco pkg install oopsla26-async-await A user can then
    import and build on the languages like so: (require oopsla26-async-await/swift)
    Documentation for the models is provided online here.'
