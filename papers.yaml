- title: 'The effect of gestational age on the socio-individual development of premature
    children: the mediating role of parental trauma and attachment quality.'
  date: 2026-05
  url: https://osf.io/cxdv8
  category: nix-development
  subcategory: ''
  authors:
  - Annaël Rocher
  - Laurine DUJARDIN
  - Marion LOUVION
  abstract: 'Some studies show an impact of prematurity on socio-individual development
    (Hua et al., 2022; Pau et al., 2015), defined by autonomy, self-awareness and
    social skills. Although this development depends on the child’s environment (Norman
    &amp; Tomlinson, 1959), few studies on this development exist and they do not
    include the child’s family environment. Yet, prematurity can impact this environment,
    often leading parents to develop postpartum parental trauma (Naeem et al., 2019)
    and affecting the quality of parent-child attachment (Fuertes et al., 2024), these
    effects are accentuated with a low gestational age (Brunson et al., 2021; Fuertes
    et al., 2024). In addition, studies show that postpartum parental trauma influences
    the quality of attachment after premature birth (Borghini &amp; Nix, 2015), yet
    no study combines these factors to study the development of preterm children.
    Thus, this study aims to examine whether the gestational age influences the socio-individual
    development of the premature child by the parental trauma related to the premature
    birth of the child, and therefore, the parent-child attachment relationship. Borghini,
    A. et Müller Nix, C. (2015). Traumatisme parental et conséquences lors d’une naissance
    prématurée. Contraste, 41(1), 65-84. https://doi-org.ezproxy.u-paris.fr/10.3917/cont.041.0065.
    Brunson, E., Thierry, A., Ligier, F., Vulliez-Coady, L., Novo, A., Rolland, A.,
    &amp; Eutrope, J. (2021). Prevalences and predictive factors of maternal trauma
    through 18 months after premature birth : A longitudinal, observational and descriptive
    study. PLoS ONE, 16(2), e0246758. https://doi.org/10.1371/journal.pone.0246758
    Fuertes, M., Martelo, I., Almeida, R., Gonçalves, J. L., &amp; Barbosa, M. (2024).
    Attachment and mother-infant interactions in dyads with infants born full-term,
    moderate-to-late preterm, and very-to-extreme preterm. Early Human Development,
    189, 105943. https://doi.org/10.1016/j.earlhumdev.2024.105943 Hua, J., Barnett,
    A. L., Lin, Y., Guan, H., Sun, Y., Williams, G. J., Fu, Y., Zhou, Y., &amp; Du,
    W. (2022b). Association of Gestational Age at Birth With Subsequent Neurodevelopment
    in Early Childhood : A National Retrospective Cohort Study in China. Frontiers
    In Pediatrics, 10. https://doi.org/10.3389/fped.2022.860192 Naeem, A. T., Shariat,
    M., Zarkesh, M. R., Abedinia, N., Teimoorybakhsh, S., &amp; Nayeri, F. (2019).
    Posttraumatic Stress Disorder and Associated Risk Factors Among Parents of Hospitalized
    Term and Preterm Neonates. Iranian Journal Of Pediatrics, 29(3). https://doi.org/10.5812/ijp.87799
    Norman, M., &amp; Tomlinson, L. R. (1959). Personal-Social development. Review
    Of Educational Research, 29(2), 197. https://doi.org/10.2307/1168959 Ohuma, E.
    O., Moller, A., Bradley, E., Chakwera, S., Hussain-Alkhateeb, L., Lewin, A., Okwaraji,
    Y. B., Mahanani, W. R., Johansson, E. W., Lavin, T., Fernandez, D. E., Domínguez,
    G. G., De Costa, A., Cresswell, J. A., Krasevec, J., Lawn, J. E., Blencowe, H.,
    Requejo, J., &amp; Moran, A. C. (2023). National, regional, and global estimates
    of preterm birth in 2020, with trends from 2010 : a systematic analysis. The Lancet,
    402(10409), 1261‑1271. https://doi.org/10.1016/s0140-6736(23)00878-4 Pau, J. C.,
    López, J. P., Salinas, F. C., Garcia, O. S., Hoyos, S. P., &amp; Olivé, E. L.
    (2015). Neurodevelopment in preterm infants with and without placenta-related
    intrauterine growth restriction and its relation to perinatal and postnatal factors.
    The Journal Of Maternal-Fetal &amp; Neonatal Medicine, 29(14), 2268‑2274. https://doi.org/10.3109/14767058.2015.1081893'
  venue: OSF Preprints (OSF Preprints)
- title: 'Why Risk it, When You Can {rix} it: A Tutorial for Computational Reproducibility
    Focused on Simulation Studies'
  date: 2026-07
  url: https://doi.org/10.31234/osf.io/a3e8v_v2
  category: nix-development
  subcategory: ''
  authors:
  - Felipe Fontana Vieira
  - Jason Geller
  - Bruno Rodrigues
  abstract: Computational reproducibility remains limited in psychological research,
    despite widespread norms for sharing data and analysis code. One reason is that
    reproducibility exists on a continuum, ranging from partial transparency—such
    as providing scripts or software version numbers—to fully executable research
    compendia that regenerate all results from raw code. In this article, we introduce
    Nix and the {rix} R package as a practical framework for achieving full computational
    reproducibility in simulation-based research. We provide a step-by-step tutorial
    demonstrating how {rix} can be used to define, build, and share isolated, project-specific
    software environments that precisely capture R versions, package dependencies,
    system libraries, and integrated development environments. We further illustrate
    this workflow by reproducing a complete manuscript using Quarto and the {apaquarto}
    extension, showing how analyses, figures, and text can be regenerated in a single,
    executable pipeline. Together, these tools lower the technical barrier to robust,
    end-to-end reproducibility and offer a scalable solution for simulation studies
    and methodological research in psychology and related fields.
  venue: ''
- title: An Evidence-driven Protocol for Trustworthy CI Pipelines
  date: 2026-05
  url: https://arxiv.org/abs/2605.21089
  category: nix-ci-cd
  subcategory: ''
  authors:
  - Fernando Castillo
  - Eduardo Brito
  - Pille Pullonen
  abstract: Enterprise software supply chains are increasingly vulnerable to infrastructure
    attacks, resulting in financial and reputational damage. Ensuring the integrity
    and provenance of software artifacts remains a significant challenge, where re-execution
    of the build and tests by every consumer to guarantee provenance produces a verification
    bottleneck and credibility reduction. This paper presents an evidence-driven protocol
    for trustworthy Continuous Integration (CI) pipelines that combines Deterministic
    Build Systems (DBS) with Trusted Execution Environments (TEEs). The approach provides
    cryptographically verifiable guarantees of integrity, authenticity, and attestation
    for CI artifacts in distributed environments, reducing implicit trust without
    requiring costly re-execution by consumers. We introduce a protocol that binds
    deterministic builds with TEE-based attestations, formalizing the evidence life
    cycle, together with a practical implementation using Nix and Intel TDX. Experimental
    results show that artifact verification is reduced from redundant computation
    to lightweight signature and policy checks. These findings demonstrate that evidence-driven
    CI pipelines establish scalable and verifiable trust in digital infrastructure,
    effectively amortizing the initial computational overhead introduced by TEEs.
  venue: arXiv (Cornell University)
- title: 'Editorial: Beyond energy production: exploring mitochondrial dynamics and
    disease'
  date: 2026-06
  url: https://doi.org/10.3389/fcell.2026.1872916
  category: nix-ci-cd
  subcategory: ''
  authors:
  - Nahid A. Khan
  - Ruben Torregrosa-Muñumer
  abstract: 'Mitochondria are no longer viewed as static ATP-producing organelles,
    but rather as dynamic, stress-responsive signaling hubs integrating metabolism,
    quality control, inflammation, redox balance, cell fate decisions, and tissue
    adaptation. The articles collected in Beyond Energy Production reflect this conceptual
    shift, highlighting how mitochondrial biology extends far beyond ATP generation
    into disease mechanisms, adaptive remodeling, and therapeutic opportunity. Studies
    across cardiovascular biology, skeletal muscle aging, neurodegeneration, lung
    disease, and ischemia-reperfusion injury, position mitochondria as an active signaling
    center and not passive responders to damage. Together, these contributions highlight
    key emerging questions: how mitochondrial dynamics are shaped by environment,
    how mitochondria integrate stress and cell-fate signals, how mtDNA is regulated,
    how metabolism is rewired in disease, and whether mitochondria themselves can
    be harnessed therapeutically.A recurrent theme emerging from this collection is
    that mitochondrial function is defined not just by biochemical activity, but also
    by their internal organization and external context. Mitochondria form dynamic
    networks continuously remodeled through fission/fusion events, processes tightly
    linked to tissue homeostasis and disease [1,2]. The review by Zhang et al. synthesizes
    how mitochondrial dynamics in cardiomyocytes coordinate energy production, quality
    control, and survival signaling. Healthy hearts adapt to changing workload and
    stress via fission and fusion, whereas, in disease, disturbed fission-fusion balance
    can produce fragmented or hyperfused mitochondrial networks that are bioenergetically
    inefficient, oxidatively stressed, and injury-prone. Importantly, mitochondrial
    dynamics are not merely descriptive features of cardiac pathology; they are mechanistically
    involved in disease progression and offer therapeutic targets although the context-dependent
    pleiotropy of fission/fusion regulators complicates translation into interventions.
    Perra et al. extend this theme by emphasizing that mitochondrial behavior is shaped
    not only by intrinsic biology but also by experimental context. Their study shows
    that culture configuration, oxygen availability, and model design can markedly
    influence mitochondrial readouts in vitro. More broadly, this underscores that
    mitochondrial phenotypes emerge from the interplay between cell-intrinsic programs
    and the external constraints imposed by the microenvironment and experimental
    systems. Together, these studies show that mitochondrial biology is shaped by
    the interplay between intrinsic network dynamics and the surrounding cellular
    environment.A second major theme from this collection is that mitochondria occupy
    a central position at the intersection of stress signaling and cell-fate control,
    integrating pro-survival and pro-death cues [3]. Petit et al. refines this idea
    by focusing on a cardiolipin platform at the mitochondrial outer membrane, where
    caspase-8 and BID generate truncated BID (tBID) driving BAX/BAK oligomerization,
    mitochondrial outer membrane permeabilization, cytochrome c release, cristae remodeling,
    ROS production, and bioenergetic collapse. Beyond apoptosis, the article describes
    how BID shapes necroptosis, pyroptosis, and ferroptosis, positioning mitochondria
    as multi-death integrators via lipid/protein assembly. Therefore, targeting mitochondrial
    membrane biology may influence multiple death pathways. On the other hand, Huang
    and colleagues extend the stresssignaling perspective into the setting of age-related
    sarcopenia, bridging a key gap: treating mitochondrial dysfunction, impaired mitophagy,
    oxidative stress, chronic inflammation, hormonal decline, and senescence as an
    interconnected network rather than parallel defects. Focusing on mitochondrial
    quality control, this framework links AMPK/SIRT1/PGC-1α and mTORC1 signaling,
    together with PINK1/Parkin, BNIP3/NIX, and FUNDC1 pathways, to mitochondrial biogenesis,
    mitophagy, oxidative stress, and muscle maintenance. By combining these mechanisms
    with diagnostics and therapies, the authors move the field beyond descriptive
    aging phenotypes toward a more coherent model of disease biology. They also point
    toward an important future direction: biomarker-driven and precision-oriented
    strategies that can stratify sarcopenia, not only by function and muscle mass,
    but by the underlying mitochondrial defects sustaining disease progression.Mitochondrial
    regulation extends beyond classical bioenergetics, encompassing multiple layers
    of metabolic signaling that range from metabolites to the mitochondrial genome
    itself. Metabolites such as NAD⁺ and TCA cycle intermediates function as signaling
    hubs that couple metabolic state to redox balance, gene regulation, and cellular
    responses [4,5], partly by shaping epigenetic landscapes through metabolite-dependent
    enzymes [6]. In parallel, mitochondrial DNA (mtDNA), long considered epigenetically
    inert, is now increasingly recognized as dynamically regulated, although the abundance,
    distribution, and functional relevance of these modifications remain debated [7,8].
    D''Alessandro et al. address a key question in Parkinson''s disease: whether restoring
    mitochondrial NAD⁺ regeneration is sufficient to rescue Complex I dysfunction
    in dopaminergic neurons. Using MCI-Park mice and mitochondria-targeted LbNOX,
    they disentangle redox balance from electron transport function. Despite partially
    restoring the mitochondrial NAD+/NADH balance, they observed no improvement in
    motor behavior, tyrosine hydroxylase levels, or dopaminergic neuron survival.
    These negative results are highly informative, demonstrating that preserving redox
    balance alone does not reconstitute complex Idependent physiology in vivo. Moreover,
    Lu and colleagues reframe TCA metabolites (citrate, succinate, fumarate, α-ketoglutarate,
    and itaconate) as signaling hubs across lung diseases. Beyond metabolism, these
    metabolites can regulate inflammation, hypoxia responses, immune activation, vascular
    remodeling, and therapy resistance. This work integrates metabolic reprogramming
    into a translational framework for biomarkers and targeted interventions, reframing
    the TCA cycle as a disease-relevant signaling network. Finally, Shock and colleagues
    provide evidence that mammalian mitochondria harbor active machinery for both
    writing (mtDNMT1 and DNMT3b) and erasing (TET-like hydroxymethylase activity)
    cytosine methylation on mtDNA. Interestingly, reduced promoter methylation correlates
    with decreases transcription of mtDNA-encoded oxidative phosphorylation genes
    and modest reductions in mtDNA copy number, implying that, unlike in the nucleus,
    mtDNA methylation may support transcription. Together, these studies illustrate
    mitochondrial regulation as an integrated system spanning membrane dynamics, genome
    control and metabolite signaling, while emphasizing the importance of mechanistic
    precision in defining both the potential and limits of mitochondrial interventions.Perhaps
    the most translationally provocative theme in this collection is the idea that
    mitochondria themselves may become therapeutic agents. Mitochondrial transplantation
    builds on recognition that mitochondria can move between cells and alter recipient-cell
    behavior [9,10]. In principle, delivery of healthy mitochondria could bypass intrinsic
    defects in oxidative phosphorylation, redox balance, or quality control, offering
    a direct organelle-level intervention. Yet despite growing interest, the field
    remains scattered across experimental systems and disease contexts [11]. Chengze
    Liang and colleagues provide a timely and comprehensive review that helps bring
    this fragmented literature into focus, particularly in the settings of ischemia-reperfusion
    injury across cardiac, cerebral, hepatic pulmonary, and renal tissues. A major
    strength of the article is its integration of mechanisms, methodology, organ-specific
    evidence, and translational challenges within a single framework, moving beyond
    proof-of-concept efficacy and clarifying the practical barriers to clinical implementation.
    Extending this perspective, work by He et al. highlights mitochondrial transfer
    in osteoarthritis, underscoring that intercellular mitochondrial exchange may
    also shape chronic degenerative disease by modulating inflammation, metabolism
    and tissue homeostasis. Importantly, these works emphasize that mitochondrial
    transplantation is not a single intervention but a chain of interdependent steps,
    each of which may influence outcome. While preclinical studies suggest benefits
    such as restored bioenergetics, reduced oxidative stress, limited calcium overload,
    and limited cell death (particularly when delivery coincides with reperfusion)
    critical questions remain unresolved regarding donor source, route and timing
    of administration, intracellular uptake, persistence, and long-term immunological
    compatibility. Together, these studies reinforce a broader conceptual shift: mitochondria
    are not confined to the cell but can potentially function as transferable biological
    units with roles in both acute injury and chronic disease.Taken together, the
    contributions in this research topic reinforce a unifying view of mitochondria
    as adaptive organelles that integrate structure, metabolism, signaling, and cell
    fate. Beyond summarizing recent advances, the collection highlights key challenges
    for the field: (1) advanced in vivo tools to study mitochondrial biology with
    spatial and temporal precision, (2) modeling mitochondrial pathways as interconnected
    systems rather than isolated modules, (3) defining therapeutic parameters (timing,
    targeting, persistence, and safety), and (4) elevating negative and partial-rescue
    studies to delineate mechanistic limits and sharpen translational strategy. In
    this sense, "beyond energy production" is not simply a thematic label, but an
    organizing principle for the next phase of mitochondrial research.'
