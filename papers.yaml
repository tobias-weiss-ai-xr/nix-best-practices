- title: Embedded Operating Systems in IoT Edge Computing
  date: 2024-12
  url: https://doi.org/10.31861/sisiot2024.2.02001
  category: nix-development
  subcategory: ''
  authors:
  - Yurii Herman
  - Halyna Lastivka
  - Andrii Samila
  abstract: Embedded systems and Edge Computing in Internet of Things (IoT) represent
    a special approach to creating systems for collecting, processing and analyzing
    data in an unstable environment. This article examines the benefits of Linux in
    this context, highlighting its flexibility, robust software ecosystems, and scalability,
    which are critical for a variety of IoT applications. The question of the operation
    of devices in an environment with a weak and/or unstable network is also raised,
    the general development of IoT/Internet-of-Everything (IoE) as a technology in
    the conditions of various distribution of high-speed networks is considered. Edge
    Computing technology, its use and areas of application in the need for rapid adaptation
    to the environment are also taken into account. Because the ability to calculate
    and analyze data on a local network can be critical for simplifying infrastructure
    in remote areas or in environments where access to an external network is difficult
    or impossible. We focus on the Linux kernel because its versatility in IoT is
    highlighted by its ability to handle a variety of workloads and seamlessly integrate
    with services, increasing adaptability to changing environmental conditions and
    ensuring reliable data processing at the edge. This adaptability is critical to
    mitigating the challenges caused by unreliable network infrastructure, thereby
    facilitating real-time decision-making and increasing operational efficiency.
    In addition, the open nature of Linux fosters innovation, allowing developers
    to create solutions tailored to the specific needs of edge computing, from industrial
    automation to smart city initiatives. By allowing devices to operate autonomously
    and efficiently manage resources at the network edge, Linux significantly optimizes
    latency, resource utilization, and overall system performance. Use of edge computing
    with correctly set-up embedded operating system (OS) allows to avoid issues common
    in IoT field and related to environment change. Article provides insight into
    pros and cons edge computing, its implementation in IoT and IoE by embedded Linux
    based OS. We will go through most common use-cases and market shares of common
    OS options. While IoT takes part in most industries by storm, there are still
    problems common for new industry. The primary advantage of using embedded *nix
    OS is the agility and ease of incorporation of those devices into edge computing
    systems, allowing to deal with network issues. Due to IoT/IoE being a new industry
    where many technologies are combined there are a lot of different approaches and
    frameworks that are used in it, but some of them are more popular and common than
    other ones. While going through the IoT/IoE data in the article, we will focus
    on embedded edge computing as one of the most efficient ways in building IoT solutions.
    Especially in perspective of OS market changes now and in near future. The result
    of that study will provide insight into possible trends and positives of the use
    of embedded OS with edge computing.
