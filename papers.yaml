papers:
- title: Deklarativna, ponovljiva, neobstojna in varna postavitev ter upravljanje
    infrastrukture z Nix/NixOS
  date: 2026-07
  url: https://repozitorij.uni-lj.si/IzpisGradiva.php?id=185108
  category: nixos
  subcategory: pattern
  authors:
  - Miha Krumpestar
  abstract: 'Every mainstream operating system and configuration manager treats the
    filesystem as a mutable global namespace and deployment as a sequence of stateful
    transformations upon it. The resulting failure modes are treated as inevitable:
    non-atomic upgrades, component interference, nominal dependency resolution permitting
    substitution attacks, and configuration irreversibility. Each is structural, not
    a bug. A purely functional model, as realized in Nix and NixOS, eliminates all
    four by construction. Four qualities were evaluated: declarative composition,
    reproducibility, impermanence, and security. Each has been studied in isolation'
  venue: Repository of the University of Ljubljana (University of Ljubljana)
- title: 'Desktop as Code: Automating Your Perfect Workstation'
  date: 2026-03
  url: https://myweirdprompts.com/episode/desktop-automation-reproducible-linux
  category: nixos
  subcategory: pattern
  authors:
  - Daniel Rosehill
  - Gemini 3.1 (Flash)
  - Chatterbox TTS
  abstract: 'Episode summary: We''ve all felt the dread of a crashed operating system
    and the weeks of tweaking required to restore those "perfect" settings. This episode
    explores the transition from treating your computer like a pet to treating it
    like a reproducible recipe using Infrastructure as Code. We dive into the power
    of NixOS, the flexibility of dotfile managers like Chezmoi, and the reliability
    of Ansible playbooks to ensure your environment is always just one command away
    from a total rebuild. Whether you are interested in immutable distributions like
    Fedora Silverblue or custom Ubuntu spins, learn how to protect the "soul of your
    machine" through modern automation. Show Notes The traditional approach to maintaining
    a personal computer is often compared to caring for a pet: each system is unique,
    manually nurtured, and devastating to lose. When a workstation fails, the tragedy
    isn''t just the loss of the operating system, but the loss of the "soul" of the
    machine—the thousands of tiny customizations, keybindings, and configuration tweaks
    accumulated over years. To solve this, power users are increasingly turning to
    Infrastructure as Code (IaC) to make their personal desktops entirely reproducible.
    ### The Dotfile Dilemma The biggest obstacle to a reproducible desktop is the
    hidden configuration files, or "dotfiles," stored in the user''s home directory.
    These files control everything from terminal padding to browser extensions. Because
    these settings are often scattered and poorly documented, they are difficult to
    track. The first step in modern desktop automation is treating these configurations
    as code. By moving these files into a version control system like Git, users can
    track changes and deploy their environment to any new machine instantly. ### The
    Declarative Approach with NixOS For those seeking the ultimate level of reproducibility,
    NixOS represents a radical shift. Unlike traditional distributions where users
    modify system files directly, NixOS uses a single declarative configuration file.
    This file acts as a master blueprint; if a setting or package isn''t defined in
    the code, it doesn''t exist on the system. This approach eliminates "configuration
    drift" and allows users to replicate their entire operating system—including drivers
    and hardware-specific settings—on new hardware with a single command. Recent partnerships
    between NixOS and hardware manufacturers like Framework suggest this functional
    approach is moving toward the mainstream. ### Modular Management and Secrets Not
    every user is ready to switch to a functional operating system. For those on traditional
    distributions, tools like Chezmoi and Ansible offer a middle ground. Chezmoi acts
    as a specialized manager for dotfiles, using templates to adapt configurations
    to different hardware, such as adjusting font sizes based on screen resolution.
    Critically, these tools integrate with password managers to handle sensitive data.
    This allows users to store their configurations in public repositories without
    exposing private API keys or SSH credentials, as the sensitive data is injected
    locally during deployment. ### The Rise of the Immutable Desktop The industry
    is also seeing a shift toward "atomic" or immutable desktops, such as Fedora Silverblue.
    These systems use a read-only root file system, which prevents accidental breakage
    of core system components. Instead of piling software onto a base layer, applications
    are handled via isolated formats like Flatpaks. If an update causes an issue,
    the user can simply roll back to a previous "deployment" at boot time. This provides
    a massive safety net, effectively offering an "undo button" for the entire operating
    system. Ultimately, the goal of desktop automation is to move away from manual
    backups and toward dynamic rebuilding. Whether through a custom-baked ISO, a declarative
    Nix configuration, or a suite of Ansible playbooks, the future of the personal
    desktop is a system that can be destroyed and recreated at will, ensuring that
    the user''s perfect environment is never more than a few minutes away. Listen
    online: https://myweirdprompts.com/episode/desktop-automation-reproducible-linux'
  venue: Open MIND
- title: 'Nix: A Solution With Problems'
  date: 2026-04
  url: https://arxiv.org/abs/2604.11398
  category: nix-packages
  subcategory: tool
  authors:
  - Matias Zwinger
  abstract: Software deployment suffers from numerous problems pertaining, for example,
    to reproducibility and dependency resolution. Many of these problems have been
    successfully solved by the purely functional approach to package management implemented
    in the Nix project. However, Nix does not solve all issues, and it does introduce
    some novel problems of its own. Therefore, the aim of this thesis is to conduct
    a literature review on the current state of research on Nix and to determine the
    direction of future research. The first part of this paper explores the problems
    historically faced in different areas of software deployment, e.g., irreproducibility
    and dependency resolution issues. The main four categories of software deployment
    tools analyzed are build systems, package managers, configuration management,
    and development environments. Popular software from each category serve as case
    studies to illustrate the problems. The second part introduces Nix and explains
    the methods utilized to solve some of the problems introduced in the earlier part.
    Because Nix is the first large project to utilize the purely functional approach,
    it is far from a perfect solution. Thus, the third part is dedicated to analyzing
    the new problems that Nix introduces, as well as old problems, which Nix has been
    unable to solve, such as trust and granular incremental builds. Furthermore, some
    proposed state of the art solutions put forth by the Nix community are discussed.
  venue: arXiv (Cornell University)
- title: 'kdeldycke/meta-package-manager: v6.3.0'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19487292
  category: nix-packages
  subcategory: tool
  authors:
  - Kevin Deldycke
  - Björn Torkelsson
  - Sid
  abstract: '[!NOTE] 6.3.0 is available on 🐍 PyPI and 🐙 GitHub. [cpan] Add CPAN package
    manager for Perl modules with installed, outdated, install, and upgrade support.
    Closes {issue}602. [deb-get] Add deb-get package manager with installed, outdated,
    search, install, upgrade, remove, sync, and cleanup support. Closes {issue}1609.
    [nix] Add Nix package manager with installed, outdated, search, install, upgrade,
    remove, sync, and cleanup support. [pacstall] Add Pacstall package manager with
    installed, outdated, search, install, upgrade, remove, and sync support. Closes
    {issue}1610. [sdkman] Add SDKMAN! package manager with installed, outdated, install,
    upgrade, sync, and cleanup support. Closes {issue}729. [stew] Add Stew package
    manager for installing pre-compiled binaries from GitHub Releases. Closes {issue}1680.
    [zerobrew] Add ZeroBrew manager with installed, outdated, install, and remove
    support. Closes {issue}1681. [uvx] Implement outdated operation. Bump minimal
    requirement to 0.10.10. Closes {pr}1704. [yarn] Split into Yarn Classic and Yarn
    Berry managers. Restrict Classic to <2.0.0. Closes {issue}1548. [yarn-berry] Add
    Yarn Berry (2.x+) manager with search and cleanup support. [winget] Switch installed
    and outdated to winget list --details structured output; filter to Origin Source:
    winget packages only, excluding sideloaded and portable entries. Bump minimum
    required version to >=1.28.190. [pip] Only report top-level packages as outdated,
    skipping transitive dependencies. Closes {issue}1214. [mpm] Support version range
    specifiers (e.g. >=1.20.0,<2.0.0) in manager requirement field. Refs {issue}1548.
    [mpm] Add must_succeed parameter to run_cli for structured-output calls, preventing
    silent data loss on CLI failures. Refs {issue}1703. [mpm] Add Chocolatey as a
    supported Windows installation method; automate package publishing on release.
    [mpm] Overhaul version tokenization: preserve original separators and case, keep
    hex hashes as single tokens, normalize pre-release aliases (alpha/a, beta/b, c/rc),
    and recognize post/patch as post-release tags. [mpm] Fix version comparison accuracy:
    integer tokens now rank above string tokens (e.g., 3.12.0 > 3.12.0a4), trailing
    .0 segments are treated as padding, the cosmetic v prefix is stripped, and false-positive
    outdated entries where parsed versions compare equal are filtered. [mpm] Snap
    version diff highlighting to separator boundaries so the full diverging token
    and its preceding separator are colored. [mpm] Detect Windows App Execution Aliases
    (reparse points) when resolving CLI paths, fixing detection of winget and similar
    tools installed via the Microsoft Store. [gem] Remove --user-install flag from
    install, upgrade, and update commands so all operations target the same gem scope
    as list and outdated. Closes {issue}389. [pip] Remove --user flag from upgrade
    command so upgrades target the same scope as list and outdated. [pip] Prepend
    the current Python executable to the list of candidates when searching for pip
    binaries, so the active environment is always checked first. [mpm] Cache installed
    package IDs before the spec loop in upgrade and remove commands, avoiding redundant
    CLI calls per package specifier. [mpm] Reduce CI matrix on pull requests: skip
    release builds, experimental Python versions, redundant architecture variants,
    and install tests. Declare windows-11-arm exclusion in [tool.repomatic.test-matrix]
    config instead of hardcoding it. Full changelog: v6.2.1...v6.3.0'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'kdeldycke/meta-package-manager: v6.4.1'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20026631
  category: nix-packages
  subcategory: tool
  authors:
  - Kevin Deldycke
  - Björn Torkelsson
  - Sid
  abstract: '[!NOTE] 6.4.1 is available on 🐍 PyPI and 🐙 GitHub. [guix] Drop the >=1.0.0
    version requirement and add a hex-hash regex variant. Guix is a rolling-release
    distribution: guix pull-managed installs and in-tree dev wrappers (./pre-inst-env
    guix, ./scripts/guix) report a git commit hash as the "version", which the previous
    >=1.0.0 specifier rejected as not satisfying the requirement and made mpm skip
    the manager. The new version_regexes chain accepts stable releases (1.4.0), git
    describe-style versions (1.4.0-7-gabc1234), and bare 7–40-char lowercase hex hashes,
    so any working guix registers as available. [mpm] Add PackageManager.unavailable_reason
    and use it in the pool''s "Skip" log line. When mpm drops a manager from selection,
    the message now spells out why it was dropped: not supported on ''<sysname>'',
    no executable named ''<names>'' found in PATH, ''<path>'' is not executable, could
    not parse version from ''<path>'' output, or version <X> does not satisfy ''<spec>''
    requirement. Replaces the previous opaque Skip unavailable <id> manager. line.
    [mpm] Move --cov and --cov-report=term from pyproject.toml [tool.pytest].addopts
    into the CI workflow. Removes pytest-cov as an unconditional test-time dependency
    for downstream packagers. [mpm] Move --numprocesses=auto, --dist=loadgroup, and
    --maxschedchunk=1 from pyproject.toml [tool.pytest].addopts into the CI workflow.
    Removes pytest-xdist as an unconditional test-time dependency for downstream packagers.
    [zypper] Loosen xmltodict floor from >=1 to >=0.12. The parse() API I rely on
    in managers/zypper.py has been stable since 0.12, so the bump to 1.0 was cosmetic
    and forced downstream packagers to ship a newer release than necessary. [mpm]
    Drop more-itertools dependency. The single peekable use site in pool.py is replaced
    with a next(iterator, None) empty-check using stdlib only. Removes one transitive
    dependency for downstream packagers. [choco] Move Chocolatey package files from
    packaging/choco/ into packaging/choco/meta-package-manager/ so the directory name
    matches the nuspec basename, as required by Chocolatey-AU''s Update-Package. Fixes
    the 🍫 Chocolatey release job that was failing with No nuspec file found in the
    package directory. [mpm] Add choco-source, nix-source, and guix-source jobs to
    tests-install.yaml that build and install from the in-repo packaging specs (packaging/choco/meta-package-manager/,
    packaging/nix/, packaging/guix/). The workflow now also triggers on pushes and
    pull requests touching packaging/{choco,nix,guix}/**, so changes to in-repo specs
    are validated before merge. [mpm] Render the chocolatey, guix, and nix release-PR
    bodies through repomatic pr-body --template-file .github/pr-templates/update-package-spec.md.noformat.
    PRs now include the standard <details> workflow-metadata block (trigger, actor,
    ref, commit, job, workflow, run links), the refresh-tip admonition pointing at
    the workflow''s dispatch URL, and the attribution footer, matching every other
    PR opened by repomatic-driven jobs across kdeldycke/* repositories. Full changelog:
    v6.4.0...v6.4.1'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'kdeldycke/meta-package-manager: v6.4.0'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19813169
  category: nix-packages
  subcategory: tool
  authors:
  - Kevin Deldycke
  - Björn Torkelsson
  - Sid
  abstract: '[!NOTE] 6.4.0 is available on 🐍 PyPI and 🐙 GitHub. [apk] Add Alpine Linux''s
    apk package manager with installed, outdated, search, install, upgrade, remove,
    sync, and cleanup support. [guix] Add GNU Guix package manager with installed,
    outdated, search, install, upgrade, remove, sync, and cleanup support. [macports]
    Add MacPorts package manager with installed, outdated, search, install, upgrade,
    remove, sync, and cleanup support. [ports] Add FreeBSD ports tree manager with
    installed, outdated, install, upgrade, upgrade_all, remove, sync, and cleanup
    support. Drives make-based source builds out of /usr/ports, delegates registry
    queries to pkg, and uses git for tree updates. [sfsu] Add sfsu (Scoop alternative)
    package manager with installed, outdated, search, install, upgrade, remove, sync,
    and cleanup support. Mutating operations delegate to Scoop. [xbps] Add XBPS (Void
    Linux) package manager with installed, outdated, search, install, upgrade, remove,
    sync, and cleanup support. [apm,apt,choco,composer,emerge,flatpak,opkg,sdkman,snap,zypper]
    Add remove operation. Closes {issue}1775. [composer] Fix install operation: use
    composer global require instead of composer global install. [apm,npm,pip] Add
    cleanup operation. [gem,winget] Add sync operation. [mpm] Add Delegate descriptor
    to capabilities.py for declarative cross-manager method delegation. [mpm] Add
    Python version and platform to --version output. [mpm] Add typed config_schema
    to the CLI group for configuration file validation. [mpm] Document pyproject.toml
    auto-discovery for per-project [tool.mpm] configuration. [mpm] Extend --table-format
    structured output to TOML, YAML, XML, JSON5, JSONC, and HJSON for all subcommands
    that produce machine-readable data (managers, installed, outdated, search, locate).
    [mpm] Change JSON output indentation from 4 to 2 spaces and stop sorting keys,
    aligning with click-extra defaults. [mpm] Rename --output-format / -o back to
    --table-format, aligning with the upstream click-extra default. [mpm] Make Chocolatey
    release job idempotent: check if version already exists on Chocolatey before pushing,
    and open a PR to update the nuspec after a successful publish. [mpm] Add Guix
    and Nix package definitions with automated update jobs on release; reorganize
    packaging/ directory into packaging/choco/, packaging/guix/, and packaging/nix/
    subdirectories. [pip] Filter mpm''s own dependency tree from outdated results
    to fix false positives in Homebrew-installed environments. Closes {issue}1767.
    [scoop] Fix CLI invocation in outdated operation. [winget] Fix search crash when
    no results are returned. [zypper] Skip install and remove tests on Linux CI runners:
    the RPM database at /var/lib/rpm is inaccessible on Ubuntu-based runners. Full
    changelog: v6.3.0...v6.4.0'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'kdeldycke/meta-package-manager: v7.5.0'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.21777789
  category: nix-packages
  subcategory: tool
  authors:
  - Kevin Deldycke
  - Björn Torkelsson
  - Sid
  abstract: '[!NOTE] 7.5.0 is available on 🐍 PyPI and 🐙 GitHub. [volta] Add Volta
    package manager (installed, install, upgrade, remove), flagged unmaintained since
    its November 2025 retirement in favor of mise. pkg:npm/ purls now also resolve
    to it. Addresses #1995. [mpm] Raise the click-extra floor from 8.6.1 to 8.7.0,
    scoping mpm''s strict-config check to its own pyproject.toml section and forcing
    telemetry off on a truthy DO_NOT_TRACK. [mpm] Raise the extra-platforms floor
    from 13.5.1 to 13.6.0, whose new AlmaLinux detection stops the spurious unrecognized-platform
    warning mpm printed on AlmaLinux hosts. [mpm] Bump the in-repo Alpine, Guix, MacPorts
    and Nix packaging specs to build from 7.4.1, switching Alpine to the PyPI sdist
    instead of the GitHub tag tarball. [snap] Fix snap remove failing with error:
    unknown flag ''color'' on recent snapd by no longer appending --color=never, which
    remove does not accept. [mpm] Add favicon.svg and banner-social.svg (light/dark
    PNG exports) as the Sphinx browser-tab icon and OpenGraph image, and switch the
    readme banner to a dark-mode-aware <picture> element. [mpm] Refresh the readme''s
    manager Sankey diagram and operation matrix. Full changelog: v7.4.1...v7.5.0'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'kdeldycke/meta-package-manager: v7.4.0'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21567645
  category: nix-packages
  subcategory: tool
  authors:
  - Kevin Deldycke
  - Björn Torkelsson
  - Sid
  abstract: '[!NOTE] 7.4.0 is available on 🐍 PyPI and 🐙 GitHub. [mpm] Raise the click-extra
    floor from 8.4.0 to 8.6.0, the release shipping the OperationTrail batch ✓/✗ trail
    upstreamed from mpm''s own dispatch layer, which mpm now consumes from the published
    package instead of a git checkout. [mpm] The Python and click-extra compatibility
    tables of the documentation read newest-first on both axes, following click-extra
    8.6.0''s {matrix} ordering defaults: the most recent compatibility information
    sits in the upper-left corner. [mpm] Bump the packaging pins of click-extra to
    8.6.0 and the Nix pin of extra-platforms to 13.3.1 across the Nix, MacPorts and
    Alpine overlays, to match mpm''s dependency floors. Breaking: [mpm] Remove the
    PackageManager.query_parts class method: Package.query_parts is the canonical
    query tokenizer. Breaking: [mpm] The SBOM stats() dictionaries drop the components_in_document
    (CycloneDX) and relationships_total (SPDX) keys, which no consumer read. Breaking:
    [mpm] Rename the manager deprecated flag to unmaintained and broaden it to cover
    abandoned or inactive upstreams (archived, years without a release, formally superseded,
    or a discontinued platform), not just officially retired projects. The deprecation_url
    attribute becomes an unmaintained_message markdown block rendered into the documentation,
    and the [mpm.managers.<id>] config override key deprecated is likewise renamed
    to unmaintained. [mpm] Flag apt-cyg, pacaur and swupd as unmaintained, joining
    apm: their upstreams are archived, abandoned or belong to a discontinued platform,
    so they are hidden from default selection and dropped from the test matrices.
    Name them explicitly or pass --all-managers to still drive them. [mpm] Add a maintenance_note
    attribute that renders a note admonition atop a manager''s documentation page
    for still-maintained but slowing or superseded upstreams worth watching (cave,
    dnf, fink, sorcery, stew, sun-tools, tazpkg, yarn, yum). [mpm] Drop the unmaintained
    pacapt, sysget and whohas tools from the benchmark comparison and add a note pointing
    their users to mpm as an actively-maintained replacement covering the same cross-manager
    operations. [mpm] Package managers gain shared parse_regex_lines and parse_json_items
    engines on the base class: configuration-defined operations and built-in managers
    now parse their listings through the same code path. [mpm] The action commands
    (install, remove, upgrade, restore) name failed packages uniformly as id@version
    in their end-of-run critical: summary, instead of a mix of raw purls and bare
    IDs. [mpm] doctor singularizes its end-of-run summary when a single manager reports
    problems. [mpm] dump --merge and dump --update-version no longer misreport an
    existing target file as about to be overwritten, and only disclose the inert --overwrite
    flag when it was actually passed. [brew,cask] cleanup invokes the cache scrub
    with the long-form --scrub flag. [mpm] Add a --plan/-p option that prints the
    exact package-manager commands each state-changing operation would run, without
    running them. Read-only queries (installed, outdated, search) still execute, so
    install, remove and upgrade --all resolve to the commands they would actually
    run; the plan prints to stdout, one copy-pasteable command per line. [mpm] Add
    an --orphans option to remove that also drops the dependencies the package alone
    pulled in, mapped to each manager''s native scoped cascade verb (apt remove --auto-remove,
    pacman --remove --recursive, dnf autoremove, xbps-remove --recursive, zypper remove
    --clean-deps). Managers with no such verb remove the package only. mpm builds
    no dependency graph: it delegates the reverse-dependency reasoning to the manager.
    [mpm] cleanup decomposes into cumulative categories, each with a two-sided flag
    pair: --orphans/--skip-orphans (system-wide orphan sweep: apt autoremove, brew
    autoremove, flatpak uninstall --unused), --cache/--skip-cache (caches, downloads
    and left-over artifacts, the category a monolithic cleanup amounts to) and --repair/--skip-repair
    (local state verification, like flatpak repair). Positive flags narrow the run
    to the listed categories, skip flags subtract them, and a plain cleanup runs the
    cache and repair categories only: the orphan sweep is the one category removing
    packages, so it stays strictly behind --orphans, uniformly across managers, just
    as remove keeps its dependency cascade behind the same flag. The per-manager narration
    and the ✓/✗ trail name the categories dispatched to each manager (✓ brew (cache)).
    A manager with no native sweep verb but a native orphan listing gets the sweep
    synthesized from its orphans query, removing the listed orphans one by one until
    none are left (the in-process equivalent of Arch''s pacman -Rns $(pacman -Qtdq)
    idiom, covering pacman, its AUR helpers and zypper); the synthesized sweep only
    engages on an explicit --orphans, so a skip flag can never remove packages a plain
    cleanup would have left alone. [mpm] Add an orphans subcommand listing the packages
    installed as dependencies that nothing requires anymore, without removing them.
    Each manager reports through its native read-only query (pacman --query --deps
    --unrequired, brew autoremove --dry-run, dnf repoquery --unneeded, zypper packages
    --unneeded, pkg autoremove --dry-run, apt autoremove --simulate, xbps-query --list-orphans,
    emerge --depclean --pretend, cave purge in its default pretend mode, pkg_delete
    -a -n). Supports the same query filtering, table projection and serialization
    as installed. [mpm] Add a doctor subcommand (aliases check and diagnose) running
    each manager''s native self-diagnosis (brew doctor, pip check, pacman --database
    --check, npm doctor, dnf check, gem check, composer diagnose, mise doctor, apt-get
    check, pkg check --checksums, xbps-pkgdb --all, flatpak repair --dry-run, scoop
    checkup, port diagnose, tlmgr check all). Read-only: health is read from each
    command''s exit code, the report (merging <stdout> and <stderr>) is relayed verbatim,
    and the run exits non-zero when any manager reports problems, so it can gate a
    CI job (-0/--zero-exit opts out). [mpm] Configuration-defined managers can declare
    remove_orphan, cleanup_orphan, cleanup_cache, cleanup_repair, doctor and orphans
    operations, wiring them to remove --orphans, the cleanup category flags and the
    orphans subcommand. Breaking: [mpm] cleanup is no longer an operation managers
    define: every manager now declares cleanup category methods only (cleanup_orphan,
    cleanup_cache, cleanup_repair), and PackageManager.cleanup() composes the natively
    implemented ones. Monolithic cleanups across the pool were reclassified as cleanup_cache,
    and a configuration-defined manager declaring the old cleanup operation is rejected
    with an error naming the category keys. [cave,pkg-tools] Their cleanup commands,
    both orphan sweeps (cave purge, pkg_delete -a), are re-declared as cleanup_orphan:
    cleanup --orphans now reaches them and cleanup --cache leaves them alone. [apt,apt-mint,brew,cask,cave,dnf,dnf5,emerge,pkg,pkg-tools,xbps,yum]
    Plain cleanup no longer removes orphaned packages: their native sweeps moved behind
    cleanup --orphans. This also stops emerge''s cleanup from triggering its pre-depclean
    world upgrade unless --orphans is given. [emerge] The cleanup steps split into
    cleanup_orphan (the safety upgrade plus --depclean) and cleanup_cache (eclean
    distfiles), giving emerge native cleanup --orphans support. [uv] cleanup skips
    uv''s cache commands when mpm itself was launched by uv run or uvx, whose parent
    process locks the cache for as long as mpm lives: each uv cache command would
    otherwise wait on its own ancestor for UV_LOCK_TIMEOUT (300 seconds by default)
    and fail, stalling the cleanup for ten minutes. [dnf,dnf5,xbps,yum] remove no
    longer cascades to orphaned dependencies by default: a plain removal keeps them.
    Use the new remove --orphans to restore the previous behavior. [mpm] Every supported
    package manager gets a dedicated documentation page detailing its platforms, operations
    and backfilled capabilities, CLI invocation and version probe, escalation and
    cooldown behaviors, purl types, selection and configuration examples and the captured
    native outputs its parsers were written against, all rendered live from the manager
    declarations at Sphinx build time. A new hub page indexes the 72 pages, and manager
    IDs in the readme''s operation matrix, the benchmark table and the augmentations
    table now link to them. [mpm] Each per-manager documentation page opens with a
    "What mpm adds to <id>" section, pitched at a reader who already knows the native
    tool: the capabilities mpm backfills for that manager (synthesized upgrade --all,
    orphan sweep, --exact/--extended search), the cross-manager reach naming its purl-ecosystem
    neighbors, and the universal augmentations. Derived live from the capability declarations,
    so it describes only what mpm does and never overstates a native limitation. [winget]
    Documentation samples use the conventional > PowerShell prompt instead of PS C:\Users\kev>,
    reconnecting them to the corpus harvester: the documented commands are now validated
    against the constructed ones, the manager page gains its full Rosetta table and
    a clean version transcript, and the reference traces render under proper pwsh-session
    fences. The full and single-package upgrade samples show the exact winget update
    --all and winget install invocations mpm runs, and the agreement-prompt and different-install-technology
    illustrations move to non-fixture console fences. [mpm] Each per-manager documentation
    page gains a Rosetta table mapping the manager''s own commands (uv pip list, brew
    install, pacman --sync, …) to their one-to-one mpm equivalents, harvested from
    the operation methods'' documented samples, and a recipes section with copy-paste
    snapshot/restore, SBOM export and CI-health-gate commands. The cooldown section
    now frames release-age gating as a supply-chain guard, the invocation section
    explain'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'kdeldycke/meta-package-manager: v7.1.0'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21245491
  category: nix-packages
  subcategory: tool
  authors:
  - Kevin Deldycke
  - Björn Torkelsson
  - Sid
  abstract: '[!NOTE] 7.1.0 is available on 🐍 PyPI and 🐙 GitHub. Breaking: [mpm] Split
    the [sbom] extra into [sbom-offline] (CycloneDX and SPDX document rendering) and
    [sbom-online] (the --network vulnerability lookups). pip install meta-package-manager[sbom]
    no longer resolves: use [sbom-offline] for the previous behavior, adding [sbom-online]
    for vulnerability scanning. [mpm] Define brand-new package managers from the configuration
    file: a [mpm.managers.<id>] section declares a manager''s platforms, CLI and version
    detection, and per-operation commands with regex or JSON parsers. Defined managers
    get --<id> / --no-<id> selectors and join the default set. [mpm] Manager definitions
    load only from a trusted local config file (owned by you, not world-writable,
    never a remote --config URL), and a command-redirecting override (pre_cmds, cli_names,
    cli_search_path) read from an untrusted source now warns: see the new {doc}security
    page. [mpm] Ship package managers as bundled configuration definitions: TOML files
    under meta_package_manager/managers/, built through the same schema as a user''s
    [mpm.managers.<id>] section but loaded at startup like built-ins and exempt from
    the config-file trust gate. [gh-ext] Add GitHub CLI extensions (gh extension)
    manager with installed, search, install, upgrade, and remove support, cross-platform
    on Linux, macOS, and Windows; mpm''s first bundled configuration-defined manager.
    Requires gh >=2.0.0. [soar] Add Soar (pkgforge) package manager with installed,
    search, install, upgrade, remove, sync, and cleanup support on Linux; a bundled
    configuration-defined manager. Requires soar >=0.12.0. [conda] Add Conda package
    manager with installed, outdated, search, install, upgrade, remove, and cleanup
    support, cross-platform on Linux, macOS, and Windows; requires conda >=4.6.0.
    [mpm] Add a global --network / --no-network flag (default off) that opts into
    network calls during a run. [mpm] mpm --network sbom queries OSV.dev for known
    vulnerabilities across OSV''s indexed ecosystems (pip, npm, cargo, gem, composer):
    CycloneDX gains a vulnerabilities array, SPDX per-package SECURITY external references,
    and the end-of-run summary a vulnerability count. [mpm] OSV responses are cached
    on disk; network failures, a missing extra, or an unwritable cache degrade gracefully
    to an SBOM without vulnerability data. [mpm] Privilege escalation is now per-manager:
    system package managers still run state-changing operations through sudo by default,
    and a new global --sudo / --no-sudo flag or per-manager [mpm.managers.<id>] sudo
    config key overrides that either way. Resolves #1295 and #33. [mpm] Escalating
    commands authenticate sudo once up front and run through sudo -n, so a password
    prompt no longer stalls the concurrent fan-out; off a terminal, managers needing
    root fail fast with a message pointing at --sudo instead of hanging. [yay] Honor
    --cooldown by overlaying a generated init.lua through a private XDG_CONFIG_HOME,
    holding back AUR upgrades and installs newer than the release-age floor while
    preserving the user''s own yay config. Requires yay 13.0.0 for its Lua hooks.
    [mpm] The CLI gains a global --export-config FORMAT option that prints the fully-resolved
    configuration (config file, environment, and defaults merged) as toml, yaml, json,
    json5, jsonc, hjson, or xml, then exits. [mpm] Managers sharing a backend lock
    (brew/cask, apt/apt-mint/deb-get, the RPM and pacman families) now run serially
    within their family during state-changing commands; members resolving to an identical
    command run it once. Fixes spurious cask failures when syncing alongside brew.
    [mpm] A single Ctrl+C now aborts a concurrent command promptly: the first interrupt
    terminates in-flight package-manager subprocesses, so the thread pool drains and
    the run exits cleanly instead of hanging until a second Ctrl+C and a threading-shutdown
    traceback. [mpm] --timeout now also bounds the manager version-detection probes,
    not just the operation that follows, so a wedged binary cannot outlast the limit
    during startup detection. [bar-plugin] Cap each mpm call the plugin makes at 60
    seconds via --timeout, so a wedged package manager fails the menubar refresh in
    about a minute instead of stalling it for several. [mpm] Raise the click-extra
    floor from 8.1.1 to 8.2.0, the first release shipping the concurrency primitives,
    the --export-config option, and the compatibility-matrix machinery mpm relies
    on. [guix] Meta Package Manager is now available in GNU Guix upstream, installable
    with guix install meta-package-manager. [guix] Rename the reference package to
    meta-package-manager, fetch its source from the tagged git commit, build it with
    setuptools.build_meta, drop the now-optional SBOM and more-itertools inputs, and
    fix the python-packageurl input name so guix install --load-path=packaging/guix
    resolves. [nix] Drop the now-optional SBOM and more-itertools dependencies from
    the reference package definition. [pip] Only target a Python the user can actually
    install into: mpm''s own bundled virtualenv and externally-managed interpreters
    (PEP 668) are skipped, so distro-managed packages no longer surface as bogus outdated
    pip upgrades. Supersedes the dependency-tree filter from #1767. [pip] Probe the
    Python interpreter version under the short read-only timeout instead of the long
    state-changing default. [mpm] The --cooldown help now shows [default: (disabled)]
    instead of the bare [default: ""], so the unset state reads as a word rather than
    an empty string. [dnf] upgrade and upgrade --all now pass --assumeyes, as the
    other dnf operations already did, so upgrades no longer hang on an interactive
    confirmation prompt. [eopkg] upgrade --all now passes --yes-all, matching the
    single-package upgrade, so it no longer hangs on an interactive confirmation prompt.
    [fwupd] Fix version-pinned installs: the device ID and release version were joined
    into a single CLI argument that fwupdmgr could not parse. [npm] install no longer
    passes --no-fund and --no-audit twice. [mpm] The installation page now documents
    which Python and click-extra versions each mpm release accepts, in tables regenerated
    from the release tags and guarded by a drift test. [mpm] Catalog every released
    standalone binary on a new documentation page, linking each platform build to
    its download and public VirusTotal analysis, with a detection-rate trend chart.
    [mpm] Add a hermetic test replaying each manager''s documented CLI samples through
    its own parsers and command builders, covering installed, outdated, --version,
    and the mutation commands; corrected the stale samples flagged across a dozen
    managers. Toward #1023. Full changelog: v7.0.1...v7.1.0'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'kdeldycke/meta-package-manager: v7.6.0'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.21871441
  category: nix-packages
  subcategory: tool
  authors:
  - Kevin Deldycke
  - Björn Torkelsson
  - Sid
  abstract: '[!NOTE] 7.6.0 is available on 🐍 PyPI and 🐙 GitHub. [vim-pack] Add Neovim''s
    built-in vim.pack plugin manager (Neovim 0.12 and above) with installed, install,
    remove and upgrade support. Plugins are keyed on their source URL, and each operation
    is a Lua one-liner run by a --clean --headless Neovim. [zinit] Add the Zinit Zsh
    plugin manager with installed, install, remove and upgrade support. Zsh is the
    CLI mpm executes, and the plugin inventory is read from an interactive shell since
    Zinit tracks plugins in state the user''s .zshrc populates. [mpm] Show each manager''s
    brand mark on its documentation page and in the manager index, from a new logo
    attribute naming an SVG vendored under docs/assets/managers/. 54 of the 75 managers
    carry one; the rest keep the default package glyph. Marks are inlined so they
    follow the light and dark themes. [mpm] Close each manager''s documentation page
    on a changelog of its own: every changelog entry scoped to that manager, grouped
    by the release that shipped it, newest first. [mpm] Add to each manager''s infobox
    an Issues and PRs badge carrying its GitHub label, in the label''s own color,
    linking to every issue and pull request filed under it. Managers sharing an ecosystem
    share one label, hence one search. [mpm] Move how mpm invokes each tool into its
    infobox: CLI names, extra search paths, the arguments and environment forced on
    every call, and the call timeout. The How mpm drives section they came from is
    reduced to the version probe and moved next to the reference traces. The tracker
    badge and the source file close the box. [mpm] Turn every URL of the manager descriptions
    into a proper link: bare URLs were rendering as dead text on the manager pages
    and in the API documentation. [mpm] Reconcile the changelog''s scope tags against
    the git history of every manager implementation, followed through the 2016 split
    of the single-file plugin, the move into a dedicated folder and the later conversions
    to bundled definitions. 13 entries covering mpm''s own packaging, installation
    documentation or CI were rescoped to [mpm], where that work already sits; 6 manager
    fixes that had never been logged were added; the apt --yes and search fixes were
    extended to apt-mint, which inherits both; and the 2.3.0 empty-output fix was
    split into its general and gem-specific halves. [mpm] Follow the documentation''s
    own light and dark toggle with the sidebar logo, instead of a single light-only
    variant that left the wordmark unreadable on the dark theme. Hide the readme banner
    on the front page, where it duplicated that logo and could not agree with the
    theme. [mpm] Turn the license page into the project''s legal sink: it now also
    carries the trademark notice, the credits for every vendored brand mark, the documentation
    artwork attributions and a pointer to where dependency licenses live. [gnome-shell]
    Add a GNOME Shell extension (GNOME 46 to 50) mirroring the Xbar/SwiftBar plugin:
    a top bar indicator lists outdated packages per manager, and every menu action
    runs mpm itself. Addresses #809. [gnome-shell] Attach the packed extension to
    every GitHub release as an attested mpm-gnome-shell-extension.zip asset, built
    with gnome-extensions pack. [bar-plugin] Menu actions run mpm itself instead of
    the manager''s native upgrade command, so manager selection, sudo policy, overrides
    and the cooldown all apply. A manager that cannot enforce an active cooldown is
    now skipped with a warning. [mpm] A batch of managers running concurrently reports
    through a determinate progress bar (Searching [####----] 3/6 managers) instead
    of an indeterminate spinner. Each manager''s own CLI call keeps its per-call spinner
    when it runs alone. [mpm] The ✓/✗ trail''s finisher carries an elapsed time only
    under --time, where it previously always showed one. [mpm] The warnings proposing
    a CLI flag as their remedy now also name the configuration key that makes it stick:
    [mpm] require_cooldown_support for the cooldown skip, and [mpm] sudo for the two
    credential warnings. [mpm] Raise the click-extra floor from 8.7.0 to 8.8.1, dropping
    mpm''s own is_stdout and prep_path helpers for the click_extra.output originals
    and inheriting click-extra''s own uncapped uv-build requirement. [mpm] Rename
    the 🔌 bar-plugin GitHub label to 🔌 plugin, now covering the Xbar/SwiftBar plugin
    and the GNOME Shell extension alike. [mpm] Fix the 🔌 plugin, 🖥 platform: macOS
    and 🖥 platform: Windows labels never being applied to issues: their keywords are
    now OR-joined into one case-insensitive pattern instead of all being required
    at once. [mpm] Fix backup, dump and sbom dying on an unhandled FileNotFoundError
    when the output path points into a directory that does not exist yet: missing
    parent directories are now created. [mpm] Fix guix install --load-path=packaging/guix
    failing on unbound python-pytest and python-xmltodict, whose modules were not
    imported, and align the definition with the upstream Guix stanza. [mpm] Fix nix-env
    --file packaging/nix failing its runtime-dependency check on the stale click-extra
    8.6.2 and extra-platforms 13.5.1 pins, bumping them to 8.8.1 and 13.6.0 to satisfy
    mpm 7.5.0''s raised floors. [mpm] Add an Unsupported managers page documenting
    which tools are deliberately excluded and why, and what a manager must expose
    to be wrappable. [mpm] Document that --cooldown replaces a stricter release-age
    policy already configured natively, instead of tightening it. [mpm] Document the
    retraction path behind each package registry (yank, unpublish, relabel, index
    revert, flag only) and the per-version publish-date metadata it exposes, since
    a cooldown only protects where a compromised release can actually be withdrawn.
    Without one the gate can even prefer a malicious version over the fix that superseded
    it. Every pool manager is mapped to its registry, and its cooldown documentation
    page now closes on that registry''s row. [gnome-shell] Lint the extension and
    its gjs test runner with ESLint against GNOME Shell''s own eslint-config-gnome
    ruleset, in a new eslint job installing the stack behind a 7-day npm --min-release-age
    cooldown. [mpm] Drop the Codecov integration, its coverage badge and the XML report
    artifacts that fed it. Coverage is now gated in CI by the [tool.coverage] report.fail_under
    ratchet, cleared by the parallel non-destructive run; the bar-plugin and destructive
    slices opt out with --cov-fail-under=0. [mpm] Run the project-metadata and GNOME
    Shell extension invariant tests on a single runner instead of on every matrix
    cell, behind a new once pytest marker and a once-tests job. Neither module imports
    package code, so the coverage floor is unaffected. [mpm] Widen the test workflow''s
    trigger to changelog.md, readme.md, docs/** and gnome-shell/**. The suite holds
    all four to byte-identity with their generators, but an edit to any of them never
    ran the test guarding it. [mpm] Declare the supply-chain cooldown window on the
    GNOME Shell extension and manager-logo workflows, and an explicit zero-length
    window on the distributor workflow, whose subject is the freshly published artifact.
    [mpm] Drop the full Homebrew cask tap clone and the HOMEBREW_NO_INSTALL_FROM_API
    override from the test matrix, both left behind by a cask-version-checkout test
    that no longer exists. [mpm] Fix the test matrix''s drift guard silently skipping
    for a week after every upstream toolkit bump: it resolved repomatic without the
    per-package cooldown exemption, so the workflow''s release-age window left the
    pinned version unresolvable and the failed run landed in the test''s skip branch.
    [mpm] Scope the docs dependency group to Python 3.14 and above, the only interpreter
    that ever renders a page. Its members drop their marker-split floors for flat
    ones, and the lockfile stops carrying a second, older resolution of the documentation
    toolchain (myst-parser, sphinx, docutils, markdown-it-py, sphinx-autodoc-typehints,
    sphinx-design) for interpreters that never build the site. Full changelog: v7.5.0...v7.6.0'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'kdeldycke/meta-package-manager: v7.3.0'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21416617
  category: nix-packages
  subcategory: tool
  authors:
  - Kevin Deldycke
  - Björn Torkelsson
  - Sid
  abstract: '[!NOTE] 7.3.0 is available on 🐍 PyPI and 🐙 GitHub. Breaking: [mpm] Move
    the declarative-manager schema, validation and class factory into the new meta_package_manager.definitions
    module, out of meta_package_manager.config (which keeps the loading policy: trust
    gate, override application, registration passes) and meta_package_manager.manager
    (which keeps the base class only). Breaking: [mpm] Move the cross-manager fan-out
    machinery (collect_from_managers, collect_per_package, OperationTrail, the shared-lock
    families and the jobs policy) into the new meta_package_manager.dispatch module,
    out of meta_package_manager.execution (which keeps the single-subprocess engine).
    Breaking: [mpm] Move the per-command column registries and the table-projection
    and serialization helpers into the new meta_package_manager.tables module, which
    also absorbs the meta_package_manager.sorting module and its SortableField vocabulary.
    Breaking: [mpm] meta_package_manager.sbom no longer re-exports the SBOM writers:
    import them from meta_package_manager.sbom.base, meta_package_manager.sbom.spdx
    and meta_package_manager.sbom.cyclonedx. [mpm] Manager definitions gain three
    schema features: per-refinement search argument templates (exact_args, extended_args
    and id_name_only_args, spliced at their {marker} position when the matching mpm
    search flag is active, and advertising native support), a [N] list-index suffix
    on JSON field selectors, and sudo = true on query operations for tools that gate
    even their read-only listings behind root. [mpm] Malformed JSON output from a
    manager''s query now logs a warning tagged with the manager ID and yields no packages,
    instead of crashing the command; built-in managers and config-defined operations
    share the same parse_json implementation. [choco] Convert from a Python class
    to a bundled configuration definition, the native exact and ID-restricted search
    switches declared through the new refinement templates. [macports] Convert from
    a Python class to a bundled configuration definition, the native exact/extended
    search switches declared through the new refinement templates. The optional description
    column of its search results is no longer populated. [stew] Convert from a Python
    class to a bundled configuration definition, its two installed-listing regexes
    merged into one alternation, with no functional change. [zerobrew] Convert from
    a Python class to a bundled configuration definition, its installed-versions array
    read through the new [N] field selector, with no functional change. [mpm] The
    --query, --exact and --overwrite options of dump and sbom now share a single definition
    and help text. [mpm] Fix the bar-plugin labeller file rule, whose glob targeted
    a directory and could never match the plugin''s module files. [bar-plugin] The
    <xbar.version> header tracks the package version again: it fell out of the version-bump
    configuration during the bump-my-version migration and was stuck at 7.0.0.dev0.
    [mpm] Sudo priming now probes the credential cache before any prompt: found warm
    (a prior sudo --validate, a NOPASSWD rule), it is silently kept alive for the
    whole run. The password notice names the escalating managers and the subcommand
    (apt needs administrator rights to upgrade: enter your password.), the sudo prompt
    is branded ([mpm] password for apt:), and the no-terminal warning names the managers
    left to fail fast. A host whose sudo is missing or cannot be run logs a warning
    instead of crashing. [mpm] Add an internal_sudo marker for managers whose CLI
    runs sudo itself mid-run and is never wrapped by mpm: cask and fink adopt it,
    and manager definitions may set it as a config field. A warm credential cache
    found at priming time is now kept alive for internal escalators too. [mpm] A mutating
    call of an internal escalator that goes silent for 30 seconds on a terminal, with
    no warm credential cache, now logs a warning that it may be waiting on a hidden
    password prompt, quoting its last output line. Addresses #1938. [mpm] --verbosity
    INFO now discloses every package manager CLI invocation as a reproducible -prompt
    line, forced environment variables included. Version-detection probes stay at
    DEBUG. [mpm] The output of package manager CLIs now streams to DEBUG logs live,
    line by line and tagged with the manager ID, instead of being dumped once the
    call completes. Closes #528. [mpm] Streamed CLI output and manager-scoped log
    lines glue the manager ID into their level prefix (debug:mas: ..., warning:gem:
    Could not list installed packages.), making logs grep-able by manager. Closes
    #530. [mpm] Disclosed CLI invocations are themed by token family: dim prompt sigil,
    environment name/value assignment pairs, highlighted binary name (directory plain,
    in the -prompt and spawn-trace lines), option-styled flags. [mpm] --no-color now
    also strips the color of log lines emitted from background threads (streamed subprocess
    output, concurrent fan-outs). [mpm] The capability probe logs one answered DEBUG
    line per manager (brew implements installed.) instead of an unanswered question
    exposing the raw class repr. [mpm] Add -0/--zero-exit: action commands then report
    per-package failures without gating automation on a non-zero exit code. Usage
    and configuration errors keep exiting 2. [mpm] Add a --columns option to the table-rendering
    subcommands (managers, installed, outdated, search, which): a comma-separated
    list of column IDs restricts and reorders the table, SQL-SELECT-style, validated
    against each command''s column registry. mpm search''s description column joins
    the registry: --description is now a shorthand for selecting it, and an explicit
    --columns selection wins. Serialized formats keep the full structured payload.
    [mpm] The mpm managers table''s binary-path highlighting is delegated to click-extra''s
    highlight_bin_name, the same renderer as the $-prompt and spawn-trace log lines.
    [mpm] Log lines emitted while a progress spinner animates now print on their own
    line above it, instead of garbling the in-progress frame. [mpm] Delegate subprocess
    spawning, output streaming, timeout enforcement and Ctrl+C child termination to
    click-extra, raising its floor from 8.3.0 to 8.4.0. [mpm] Authenticate the GitHub
    API release lookups in the Guix, Nix and yay cooldown workflow jobs, which flaked
    on the anonymous rate limit. [mpm] The per-manager table of the augmentations
    page now renders live at Sphinx build time, derived from the capability declarations
    in the manager implementations. Drops steamcmd''s stale full-upgrade --all row.
    [mpm] The PyPI keywords and the labeller file/content rules in pyproject.toml
    are now generated from the manager pool by docs/docs_update.py. Every bundled
    manager gains labeller coverage, definition-file globs are anchored on their full
    stem, and the chocotaley keyword typo is fixed. [mpm] Bundled manager definitions
    now embed their version-probe and parser output samples in a [samples] table of
    their own TOML file; the test suite derives its checks from the shipped files
    instead of hardcoded per-manager fixtures. [bar-plugin] Version differences are
    now highlighted in the outdated-package menu lines, with the same coloring as
    mpm outdated: common prefix gray, installed suffix red, latest suffix green. Package
    lines carry ansi=true so both SwiftBar and Xbar render the colors. [mpm] Delegate
    --cooldown duration parsing and the cross-command --sort-by machinery to click-extra,
    keeping the same per-table sorting semantics. -s/--sort-by now renders at the
    end of its option group in help screens. [mpm] mpm which joins the sortable-table
    commands instead of ignoring --sort-by, its manager column leading the default
    sort. [mpm] docs/docs_update.py now renders the pyproject.toml label arrays in
    pyproject-fmt''s canonical style, ending the pull-request ping-pong between the
    update-docs and format-pyproject autofix jobs. A new test asserts the rewritten
    sections stay a pyproject-fmt fixpoint. [mpm] The dump and Brewfile provenance
    headers and the bar-plugin upgrade notice now write the bare package version,
    dropping their v prefix. [cask] upgrade --all now passes --greedy to brew upgrade
    when auto-updating packages are included, matching the outdated behavior. Auto-updating
    casks reported as outdated were never upgraded. Closes #1940. [pipx] outdated
    now relies on pipx''s native pipx list --outdated query on pipx 1.16.0 and newer:
    all venvs are checked in a single call, each by its own backend (pip or uv). Older
    pipx keeps the previous per-venv pip probes. Full changelog: v7.2.0...v7.3.0'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'kdeldycke/meta-package-manager: v6.4.2'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20119319
  category: nix-packages
  subcategory: tool
  authors:
  - Kevin Deldycke
  - Björn Torkelsson
  - Sid
  abstract: '[mpm] Compile version_regexes with re.MULTILINE only, dropping re.VERBOSE.
    Under re.VERBOSE, unescaped whitespace in the pattern is silently ignored, so
    patterns like r"guix GNU Guix (?P<version>...)" would never match guix --version
    output and the manager was reported as unavailable with could not parse version
    from <path> output. Affected guix, nix, and stew, all of which now correctly detect
    their installed version. steamcmd, which used \ escapes to work around the same
    flag, is unaffected. Full changelog: v6.4.1...v6.4.2'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'NixNet: Reproducible Virtual Network Experiments'
  date: 2026-07
  url: https://doi.org/10.1145/3822163.3827939
  category: nix-packages
  subcategory: tool
  authors:
  - Benedikt Spies
  - Marcin Bosk
  - Paulo Mendes
  abstract: In practice, network experiments are difficult to share and repeat due
    to undeclared dependencies, environment drift, and fragile imperative scripts.
    These problems cause experiments to silently diverge across machines and time,
    making results hard to verify and build upon. In this paper, we present NixNet,
    a framework that automates the complete experiment lifecycle—from dependency installation
    to resource cleanup. NixNet leverages the Nix package manager to enable reproducibility
    and preservation of network experiments through a virtual testbed. Testbeds are
    defined by a single declarative expression specifying network nodes, virtual links,
    link characteristics, and application scripts. By enforcing strict isolation using
    Linux namespaces, NixNet eliminates unintended side-effects and ensures reproducibility
    by pinning the entire dependency closure, including userspace binaries and input
    data. NixNet configures the Linux networking stack directly via syscalls, providing
    a lightweight yet strongly isolated testbed. We demonstrate NixNet's utility through
    scenarios in protocol research—including Media over QUIC streaming and LEO satellite
    link emulation—and provide a detailed comparison against Mininet and containerlab,
    showing superior scalability and isolation properties.
  venue: ''
- title: Nix to the Rescue for a Reproducible HPC-AI Software Stack
  date: 2026-07
  url: https://arxiv.org/abs/2607.26688
  category: nix-flakes
  subcategory: method
  authors:
  - Wenke Du
  - Jean-Marc Gratien
  - Raphael Gayno
  abstract: 'Reproducibility in HPC remains difficult under the constraints of production
    supercomputers: no root access, limited internet, and software stacks that increasingly
    span C/C++, Fortran, Python, MPI, and GPU runtimes. Traditional approaches based
    on environment modules and Conda require manual intervention to locate dependencies,
    leak system libraries into builds, and fail to compose across projects. Containers
    help with deployment but do not by themselves guarantee reproducibility. We report
    on our experience building a hybrid HPC/AI software stack with Nix, covering local
    development on a workstation without root and remote deployment as an Apptainer
    image on a production cluster. Nix''s consistent package layout, full environment
    isolation, and flake-based composition resolve the dependency discovery, leakage,
    and composition problems we encountered, while unifying C/C++ and Python management
    under a single declarative specification that also generates the deployment container.
    We discuss trade-offs against Spack and Guix, the development-versus-production
    split addressed via CMake presets, and current gaps in ML package coverage in
    Nixpkgs.'
  venue: HAL (Le Centre pour la Communication Scientifique Directe)
- title: 'LoganEvans/chiral-gauge-dynamics: Foundational Release of Chiral Gauge Dynamics'
  date: 2026-07
  url: https://github.com/LoganEvans/chiral-gauge-dynamics/tree/v1.0.0
  category: nix-flakes
  subcategory: method
  authors:
  - L. Evans
  abstract: 'This release marks the initial public publication of the Chiral Gauge
    Dynamics (CGD) formalization and its accompanying foundational manuscript. Included
    in this release: The complete Lean 4 formalization of the CGD axioms, kinematic
    geometry, and emergent properties. The LaTeX source code for the introductory
    paper (cgd-foundations). Python analysis scripts and data sets for the phenomenological
    evaluation of the proton radius puzzle. Key formalized results in this version:
    Emergence of unimodular gravity from the self-dual chiral sector via the Urbantke
    metric. Derivation of a topological mass gap and stable solitons in the anti-self-dual
    sector. Kinematic isolation of self-interacting dark matter (SIDM) from the self-dual
    topology. Geometric emergence of the Dirac equation, quantum entanglement bounds,
    and the Born rule. Hadronic phenomenology including Sivers and Boer-Mulders kinematic
    sign flips, and the requirement of an axial-vector condensate. Build environment:
    This release is configured with a Nix flake for exact reproducibility of the Lean
    4 and Lake environment. It relies on the Litlib library to explicitly track and
    parameterize boundaries from historical, unformalized peer-reviewed literature.'
  venue: Open MIND
- title: 'LoganEvans/litlib4: Litlib4 Initial Release'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21432195
  category: nix-flakes
  subcategory: method
  authors:
  - L. Evans
  abstract: 'v1.0.0: Initial Release This is the initial public release of Litlib4,
    a metadata and transcription framework for scientific literature in Lean 4. This
    release establishes the core metadata framework and CLI tooling for tracking unformalized
    physical literature. Instead of using global axiom statements to represent unformalized
    literature, Litlib4 allows researchers to encode peer-reviewed claims into parameterized
    typeclasses, restricting unproven assumptions strictly to the downstream theorems
    that explicitly require them. Core Features Compartmentalized Axiomatics: Infrastructure
    for encoding physical literature as strict boundary classes (signatures). Metadata
    Macros: The Litlib.paper, Litlib.equation, and @[litlib_track] macros allow users
    to embed metadata (BibTeX, authors, DOIs, page numbers) directly into Lean 4 declarations.
    Litlib Report CLI (litlib_report): Dashboard view: Generates hierarchical CLI
    views of tracked literature, equations, and standalone theorems. LaTeX artifact
    generation: The --latex flag generates a LaTeX integration package, including
    a .sty package, a labeled .tex formal code appendix, and deduplicated .bib files.
    Inline citations: Introduces the \leanref{} LaTeX macro to cross-reference Lean
    4 declarations directly from the main text of a paper. Transcription Guidelines:
    Documentation provided in docs/conventions.md and docs/ai_transcription_prompt.md
    detailing transcription rules to prevent dimensional collapse and enforce boundary
    conditions. Reproducibility: Configured with Nix Flakes to ensure exact Lean and
    Lake toolchain matching. Usage Litlib4 is designed to be used as a dependency
    in downstream Lake projects. Literature can be transcribed and tracked locally
    without requiring upstreaming to a central repository. See the README for installation
    instructions.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Spatial rendering cost profiling and visualization framework using spherical
    harmonics cost probes
  date: 2026-07
  url: https://resolver.tudelft.nl/uuid:cb5c40f9-449b-4bf7-ba8a-e65c76e3a45a
  category: nix-flakes
  subcategory: method
  authors:
  - D.J. Bettencourt de Freitas
  abstract: 'This dataset contains the software developed for the master''s thesis
    "Visualizations for Guiding Rendering Costs" (Danilo José Bettencourt de Freitas,
    Delft University of Technology, 2026).<br><strong>Objective</strong>. Stable frame
    rates are critical to real-time rendering, but conventional frame profilers only
    reveal when and why a frame exceeds its budget — not where in the scene, or along
    which view direction, the bottleneck lies. Developers relying on manual scene
    exploration or fixed camera paths risk missing expensive viewpoints or entire
    regions. This software implements a probe-based framework that captures view-dependent
    rendering cost across a static 3D scene and surfaces the expensive viewpoints
    through coordinated visualizations.<br><strong>Type of research.</strong><strong>
    </strong>Applied computer-graphics / tool-building research, evaluated qualitatively
    through a working implementation and a set of rendering case studies rather than
    a controlled user study.<br><strong>Methods.</strong>A uniform grid of probes
    samples rendering cost over view directions on a sphere and encodes each probe''s
    signal as memory-efficient Spherical Harmonics (SH) coefficients; a separate confirmation
    pass recovers each probe''s true peak cost free of SH band-limiting error. Six
    linked visual idioms then guide the user from a global cost overview down to the
    specific expensive viewpoint. The framework is integrated into a custom Vulkan
    renderer and evaluated on case studies covering common bottlenecks — expensive
    materials, over-submitted draw calls from misconfigured occlusion culling, and
    vertex bottlenecks from missing level-of-detail.<br><strong>Contents</strong>.
    The complete C++ source of the Vulkan rendering engine and the SH cost-probe profiling/visualization
    framework; the primary thesis application; and four built-in procedural case-study
    scenes (overdraw, geometry, dungeon, peaks) that reproduce the evaluated bottlenecks.
    Also included: GLSL shader sources, glTF/GLB example assets and .scene configuration
    files, unit tests, and the full pinned build toolchain (Nix flake + CMake + Makefile),
    plus a README with build/run instructions, an MIT license, and citation metadata.
    Building and running require a Linux system (X11 or Wayland with XWayland) and
    a Vulkan-capable GPU.<br>'
  venue: Open MIND
