- title: Improving the Usability of Mondriλn, a Visual Esoteric Functional Programming
    Language
  date: 2025-01
  url: https://eprints.ost.ch/id/eprint/1365/1/HS%202025%202026-SA-EP-Strolz-Elvedi-PL%20FP%20Haskell%20Open%20Slot%202.pdf
  category: nix-reproducibility
  subcategory: ''
  authors:
  - Sven Elvedi
  - Timo Strolz
  abstract: The aim of this project is to make the lambda calculus more accessible
    through interactive visualization. A previous project developed Mondriλn as a
    proof of concept CLI application that generates Mondriλn images from lambda terms
    and vice versa. This project builds on the initial proof of concept by re-developing
    it as an interactive web application (Mondriλn+). Improved aspects are the visual
    representation of nested abstractions and parenthesized terms. Additional features
    include customizable visualizations, an α-conversion equivalent transformation
    for the images, an interactive web interface and an enhanced language specification
    for the images. Mondriλn+ is written in Haskell and uses Nix in combination with
    Cabal as its build tool. The production code gets compiled to WebAssembly. This
    enables the development of a type safe and reactive UI with reproducible builds
    and high portability. The Mondriλn language specification was redesigned to enable
    greater customization, stronger invariants, and an improved user experience. Among
    the evaluated Haskell web frameworks, Miso was chosen for its simplicity and existing
    documentation. The core concept of the application remains the pure lambda calculus
    with an extended intermediate representation containing visual information on
    how to render the resulting images. Mondriλn+ can generate images from textual
    lambda calculus terms and vice versa. The application can perform β-reduction
    on Mondriλn+ images and on their corresponding textual representations. It supports
    α-conversion equivalent transformations on images, implemented as color changes.
    Users can either customize Mondriλn+ images implicitly by the way they enter textual
    terms and explicitly by resizing individual elements. The application can be used
    to teach and learn the lambda calculus in an interactive and visually appealing
    way. The current version of Mondriλn+ has potential for further development. Ideas
    for additional features include for example animations of β-reduction or scanning
    printed versions of Mondriλn+ images.
  venue: HSR (HSR University of Applied Sciences Rapperswil)
