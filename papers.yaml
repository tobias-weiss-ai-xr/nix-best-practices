- title: 'EA-HK-INFRA-01: The Infrastructure Holographic Kernel — Infrastructure That
    Survives Its Own Deprecation'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19769562
  category: nix-reproducibility
  subcategory: method
  authors:
  - Lee Sharks
  abstract: 'EA-HK-INFRA-01 applies the Holographic Kernel specification (EA-HK-01)
    to operational infrastructure. It defines an infrastructure holographic kernel
    as a DOI-anchored git repository in which any clone contains the role definitions,
    dependency rules, configuration templates, provenance chain, and verification
    tests needed to reconstruct the system''s architecture after provider failure,
    service deprecation, or substrate loss. The document situates this contribution
    relative to existing software citation, reproducible build, and supply-chain provenance
    practices (SLSA, Nix, Zenodo/GitHub releases); applies the Three Compressions
    Theorem to infrastructure systems (Regime 1 lossy drift, Regime 2 platform extraction,
    Regime 3 kernel preservation); and specifies the Back-Projection Test as a pre-deployment
    gate. The praxademic.com case study grounds the problem in real architectural
    erasure. All kernel scripts (kernel.sh, verify.sh, health.sh, fetch-secrets.sh,
    topology.sh) are provided as reference implementations. The implementation maturity
    level is v0.1 (structural presence verification). A production-grade v1.0 is specified
    as the target for Phase 3 deployment. Novel contribution: DOI anchoring at the
    architecture level; Back-Projection Test as pre-deployment gate; role operators
    rather than fixed service identity; self-projection of missing roles; holographic
    receipt per deployment. Live URLs: holographickernel.org · crimsonhexagonal.org
    · spxi.dev Hex: 06.SEI.HK.INFRA.01 · ORCID: 0009-0000-1599-0703 · Version: 1.1
    · ∮ = 1'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Modularity and Lazy Evaluation in Nixos: A Functional Approach to Operating
    System Configuration'
  date: 2025-01
  url: https://doi.org/10.1109/ic3ecsbhi63591.2025.10991248
  category: nixos
  subcategory: ''
  authors:
  - Nikhil Singh
  - Anurag Singh Baghel
  - Priyanka Mishara
  abstract: 'In contrast to traditional imperative models the Linux distribution known
    as NixOS takes a purely functional declarative approach to system configuration.
    Two important facets of NixOS that are essential to its distinctive design are
    examined in this work: modularity and lazy evaluation. Users can create reusable
    and adaptable modules by utilizing NixOS''s modularity which enables a clear division
    of responsibilities in system configuration. A defining characteristic of functional
    programming is lazy evaluation which guarantees that only essential components
    are assessed resulting in effective resource management. These features provide
    substantial advantages in practical situations especially with regard to the systems
    repeatability dependability and maintainability. NixOS offers a deterministic
    and atomic method of software deployment for sectors that depend on massive dispersed
    systems like cloud infrastructure and continuous integration sectors. Reproducibility
    across environments is ensured allowing for reliable rollback procedures and downtime-free
    upgrades. This work also shows via real-world experience how the NixOS module
    system abstracts complicated configuration sets facilitating quick setups and
    streamlining the administration of complex systems. NixOS is very configurable
    for both development and production environments because configurations are arranged
    into readily accessible modules that allow users to quickly adapt to a variety
    of environments without requiring manual intervention. Through real-world use
    cases this work explores the architectural ideas underlying NixOS''s modular and
    lazy configuration model. It also looks at how current industry issues like scalable
    infrastructure management continuous deployment pipelines and repeatable builds
    can be addressed by NixOS''s functional design.'
  venue: ''
- title: Toward Plausibly Deniable Dual-Environment Computing
  date: 2026-01
  url: https://urn.kb.se/resolve?urn=urn:nbn:se:su:diva-256198
  category: nixos
  subcategory: ''
  authors:
  - Janosch Noah Bühler
  abstract: Journalists and activists may need to protect sensitive data even when
    a device is searched or seized. Encrypted storage can protect data contents, but
    it does not necessarily hide that sensitive activity occurred, which can still
    put users in conflict with law enforcement. Plausible deniability systems such
    as hidden volumes, where hidden data is stored inside the apparent free space
    of an outer encrypted volume, address part of this problem by making hidden data
    difficult to prove from ciphertext alone. However, prior forensic research shows
    that operating systems and applications can still create persistent artifacts
    that reveal hidden volume use. This thesis addresses the problem of reducing such
    visible operating-system artifacts by adopting a dual-environment design, where
    an ordinary decoy environment remains available while hidden activity is redirected
    into hidden storage. Specifically, the thesis combines declarative NixOS configuration
    and Linux overlay filesystems into a reproducible dual-environment artifact. A
    dual environment lets the same machine present an ordinary decoy system while
    hidden work is activated separately and written to a mounted hidden storage root.
    The thesis applies Design Science Research through design, demonstration, and
    evaluation. The main artifact is the NAILS tool, the NixOS Anti-forensics Isolation
    & Layering System, implemented in Rust as a NixOS-only command-line interface
    (CLI) and core orchestration layer. It activates a hidden environment from a mounted
    hidden storage root, stages hidden NixOS configuration, mounts overlays, supports
    standard and emergency deactivation, and verifies visible-system posture. The
    NAILS operating system (NAILS OS) serves as the separate installable amnesic NixOS
    reference platform used for demonstration and forensic evaluation. VeraCrypt provides
    the evaluated plausible-deniability backend, but the architecture accepts any
    mounted directory with the expected structure. The evaluation combines implementation
    inspection, forensic analysis, and supporting automation evidence. The completed
    VeraCrypt-backed forensic evaluation used The Sleuth Kit, file-listing diffs,
    raw carving, raw iiistring searches, and targeted artifact checks. The results
    show that selected user-facing artifacts were not identified after either standard
    or emergency deactivation, including shell history, recent-file metadata, browser
    state, Secure Shell (SSH) metadata, thumbnails, and visible text logs. Hidden
    package and Nix store indicators were baseline-equivalent because the same /nix/store
    and /persist/nix/store entries were already present at baseline and did not appear
    in the baseline diffs. Mount indicators were also baseline-equivalent by count
    and context. Selected raw-string indicators were baseline-equivalent across baseline,
    post-standard, and post-emergency states, and workload canaries were not recovered
    as active files in the checked outputs. Automated tests also exercise a Linux
    Uni- fied Key Setup (LUKS) volume with the fourth extended filesystem (ext4) and
    real-filesystem directory roots, which supports backend abstraction at regression-test
    level. Here, reproducible refers to build and configuration determinism, while
    the forensic evidence supports the state comparison. Performance benchmarking,
    usability evaluation, memory forensics, and comparative external backend forensics
    were not conducted. Project au- tomation provides regression assurance rather
    than broader forensic proof and is documented separately as repository-hardening
    evidence. The thesis concludes that the architecture is feasible and partially
    ef- fective for reducing selected persistent artifacts in the tested setting,
    but stronger plausible-deniability claims require broader forensic evaluation
    across tools, backends, and usage conditions.
  venue: KTH Publication Database DiVA (KTH Royal Institute of Technology)
- title: 'rix: Reproducible Data Science Environments with ''Nix'''
  date: 2024-09
  url: https://doi.org/10.32614/cran.package.rix
  category: nix-packages
  subcategory: ''
  authors:
  - Bruno Rodrigues
  - Philipp Baumann
  abstract: Simplifies the creation of reproducible data science environments using
    the 'Nix' package manager, as described in Dolstra (2006) . The included ‘rix()'
    function generates a complete description of the environment as a 'default.nix'
    file, which can then be built using ’Nix'. This results in project specific software
    environments with pinned versions of R, packages, linked system dependencies,
    and other tools or programming languages such as Python or Julia. Additional helpers
    make it easy to run R code in 'Nix' software environments for testing and production.
  venue: ''
- title: Reproducibility of Build Environments through Space and Time
  date: 2024-04
  url: https://arxiv.org/abs/2402.00424
  category: nix-packages
  subcategory: ''
  authors:
  - Julien Malka
  - Stefano Zacchiroli
  - Théo Zimmermann
  abstract: Modern software engineering builds up on the composability of software
    components, that rely on more and more direct and transitive dependencies to build
    their functionalities. This principle of reusability however makes it harder to
    reproduce projects' build environments, even though reproducibility of build environments
    is essential for collaboration, maintenance and component lifetime. In this work,
    we argue that functional package managers provide the tooling to make build environments
    reproducible in space and time, and we produce a preliminary evaluation to justify
    this claim. Using historical data, we show that we are able to reproduce build
    environments of about 7 million Nix packages, and to rebuild 99.94% of the 14
    thousand packages from a 6-year-old Nixpkgs revision.
  venue: ''
- title: Does Functional Package Management Enable Reproducible Builds at Scale? Yes.
  date: 2025-04
  url: https://arxiv.org/abs/2501.15919
  category: nix-packages
  subcategory: ''
  authors:
  - Julien Malka
  - Stefano Zacchiroli
  - Théo Zimmermann
  abstract: 'Reproducible Builds (R-B) guarantee that rebuilding a software package
    from source leads to bitwise identical artifacts. R-B is a promising approach
    to increase the integrity of the software supply chain, when installing open source
    software built by third parties. Unfortunately, despite success stories like high
    build reproducibility levels in Debian packages, uncertainty remains among field
    experts on the scalability of R-B to very large package repositories. In this
    work, we perform the first large-scale study of bitwise reproducibility, in the
    context of the Nix functional package manager, rebuilding 709816 packages from
    historical snapshots of the nixpkgs repository, the largest cross-ecosystem open
    source software distribution, sampled in the period 2017-2023. We obtain very
    high bitwise reproducibility rates, between 69 and $91 \%$ with an upward trend,
    and even higher rebuildability rates, over $99 \%$. We investigate unreproducibility
    causes, showing that about $15 \%$ of failures are due to embedded build dates.
    We release a novel dataset with all build statuses, logs, as well as full “diffoscopes”:
    recursive diffs of where unreproducible build artifacts differ.'
  venue: ''
- title: An Evaluation of Nix Principles for Automotive Software Package management
  date: 2025-01
  url: https://urn.kb.se/resolve?urn=urn:nbn:se:uu:diva-568294
  category: nix-packages
  subcategory: ''
  authors:
  - Jagadish Kamini, Adarsh
  abstract: This thesis addresses software environment management challenges in the
    automotive industry through Micronix, a lightweight, Nix-inspired package manager
    designed for QNX 8, a real-time operating system. Following design science research
    principles, we investigate the adaptation of Nix principles for automotive software
    package management, emphasizing feasibility, reproducibility, and applicability
    to resource-constrained environments. Performance evaluation is deferred to future
    work. A qualitative evaluation documents Micronix's behavior in managing a small
    set of cross-compiled packages. Through comparative analysis between QNX 8 and
    Linux, we identified specific configuration requirements for cross-platform package
    deployment. Initial testing demonstrated basic functionality for package installation,
    profile management, and dependency tracking. No formal safety certification or
    performance benchmarking was conducted, as these are required for production use.
    The research contributes a prototype implementation exploring package management
    in the QNX environment and documents technical challenges encountered when adapting
    Nix concepts to embedded systems. Case studies with three test packages provide
    initial evidence for the feasibility of implementing basic Nix-inspired package
    management features on QNX 8.
  venue: KTH Publication Database DiVA (KTH Royal Institute of Technology)
- title: Evaluating Nix for automotive embedded targets
  date: 2025-01
  url: https://urn.kb.se/resolve?urn=urn:nbn:se:uu:diva-568601
  category: nix-packages
  subcategory: ''
  authors:
  - Akula, Ashwini Sandeep
  abstract: 'This thesis evaluates the performance of software deployment and runtime
    behavior on different computing platforms used in automotive systems. The study
    compares the Nix package manager with the traditional APT system on both Linux
    and QNX operating systems, using x86 and ARM architectures. This thesis benchmarks
    performance using four key performance indicators (KPIs): installation time, memory
    usage, application startup time, and cache behavior. In addition to package management,
    the evaluation includes systematic experiments on symlink resolution and dynamic
    library loading — two critical factors affecting application startup latency and
    real-time responsiveness. The findings reveal distinct differences in how these
    operating systems and package managers handle caching, dependency isolation, and
    symbol resolution. These insights contribute to understanding the practical implications
    of adopting Nix in safety-critical, resource-constrained environments, and inform
    best practices for improving development efficiency and product reliability in
    the automotive domain.'
  venue: Diva portal (Dalarna University Library)
- title: 'Nix: Ratkaisu onglemilla'
  date: 2025-12
  url: https://aaltodoc.aalto.fi/handle/123456789/142000
  category: nix-packages
  subcategory: ''
  authors:
  - Matias Zwinger
  abstract: Software deployment suffers from numerous problems pertaining, for example,
    to reproducibility and dependency resolution. Many of these problems have been
    successfully solved by the purely functional approach to package management implemented
    in the Nix project. However, Nix does not solve all issues, and it does introduces
    some novel problems of its own. Therefore, the aim of this thesis is to conduct
    a literature review on the current state of research on Nix and to determine the
    direction of future research. The first part of this paper explores the problems
    historically faced in different areas of software deployment, e.g., irreproducibility
    and dependency resolution issues. The main four categories of software deployment
    tools analyzed are build systems, package managers, configuration management,
    and development environments. Popular software from each category serve as case
    studies to illustrate the problems. The second part introduces Nix and explains
    the methods utilized to solve some of the problems introduced in the earlier part.
    Because Nix is the first large project to utilize the purely functional approach,
    it is far from a perfect solution. Thus, the third part is dedicated to analyzing
    the new problems that Nix introduces, as well as old problems, which Nix has been
    unable to solve, such as trust and granular incremental builds. Furthermore, some
    proposed state of the art solutions put forth by the Nix community are discussed.
  venue: Aaltodoc (Aalto University)
- title: RubyGems with Nix
  date: 2025-01
  url: https://doi.org/10.1007/979-8-8688-1802-8_5
  category: nix-packages
  subcategory: ''
  authors:
  - David Berube
  abstract: So far, we’ve discussed a number of different ways to install Ruby—via
    a system package manager like apt or rpm, via rbenv, and via asdf-ruby. We’ve
    discussed the advantages and disadvantages of each at length and even mentioned
    in passing several package management systems from other programming languages—like
    conda.
  venue: Apress eBooks
- title: Nix for Polyglot, Reproducible Data Science Workflows
  date: 2026-01
  url: https://doi.org/10.5281/zenodo.18138617
  category: nix-packages
  subcategory: ''
  authors:
  - Bruno Rodrigues
  - Philipp Baumann
  abstract: Reproducible analysis requires more than clean, well-documented code;
    it demands the precise management of software dependencies, computational environments,
    and workflow execution. While researchers can combine tools like [Docker]{.pkg},
    [renv]{.pkg} for [R]{.proglang} packages (or [uv]{.pkg} for [Python]{.proglang}
    packages) and [Make]{.pkg} to address these needs, the resulting toolchain is
    often complex and fragile, requiring the coordination of multiple disparate systems.
    This paper introduces a unified framework built on the [Nix]{.pkg} package manager,
    made accessible through two [R]{.proglang} packages. The first, [rix]{.pkg}, generates
    declarative [Nix]{.pkg} expressions to define version-pinned, reproducible environments
    that encompass [R]{.proglang}, [Python]{.proglang}, [Julia]{.proglang}, and system-level
    dependencies. The second, [rixpress]{.pkg} (and its [Python]{.proglang} port,
    [ryxpress]{.pkg}), leverages these environments to orchestrate polyglot pipelines
    where each computational step runs in a hermetically sealed, language-specific
    environment with automatic caching. By treating the entire computational environment
    as code, this integrated approach ensures a high degree of reproducibility, supports
    collaboration across heterogeneous systems, and helps guarantee that analyses
    remain executable long into the future.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Opam's Nix system dependency mechanism
  date: 2025-04
  url: https://doi.org/10.59350/rpf2m-9er76
  category: nix-packages
  subcategory: ''
  authors:
  - Ryan Gibb
  abstract: 'On 22 Apr 2022, three years ago, I opened an issue in the OCaml package
