  subcategory: ''
  authors:
  - Kierán Meinhardt
  abstract: 'This dataset and software package provide a comprehensive metrical analysis
    of the Anuṣṭubh verses found in the great Indian epic, the Mahābhārata. Using
    a computational approach, the project extracts, scans, and categorizes verses
    to identify patterns, variations, and statistical distributions of the most common
    Sanskrit meter. The repository includes the full pipeline for: Metrical Scansion:
    Algorithmic identification of light (laghu) and heavy (guru) syllables. Comparative
    Analysis: Data generation for both the Mahābhārata and Rāmāyaṇa in CSV format.
    Statistical Visualization: A Jupyter Notebook detailing the findings through descriptive
    statistics and visualizations. Technical Infrastructure To ensure high scientific
    reproducibility, this project uses: Nix: For deterministic builds and environment
    management. Haskell: For the core scansion logic and data processing. Jupyter/Python:
    For statistical analysis and plotting.'
