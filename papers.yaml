- title: Coco-Artifact2026-2
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20017220
  category: nix-containers
  subcategory: method
  authors:
  - Anon
  abstract: 'Artifact Description Option 1 (Recommended): Minimal Setup, Larger Download
    If you prefer an easier setup and don’t mind a larger download: Download testCoco-docker-before-setup.tar.gz.
    Load the Docker image: docker load < testCoco-docker-before-setup.tar.gz Start
    a container from the loaded image and enter it. Navigate to: cd /testCoco/ Run
    the setup and showcase scripts: bash ./setup.shbash ./showcase.sh This will install
    the required dependencies (including opam, Rocq, and the Lexa compiler). The scripts
    will execute automatically, display output. During the execution of showcase.h,
    it will pause in the middle, right before benchmarking, and then indicate: where
    to find the verification examples where to find the benchmarking examples You
    can then continue execution; the benchmarking process will reproduce the results
    reported in the paper. Option 2: More Setup, Smaller Download If you are comfortable
    with a bit more setup and prefer a smaller download: Download: flake.nix testCoco.zip
    Build the Docker image: nix build . in a directory with flake.nix This will produce
    a Docker image named cocosys:v3. Unzip testCoco.zip and move its contents to the
    root directory of cocosys:v3. This setup corresponds exactly to the contents of
    testCoco-docker-before-setup.tar.gz. Artifact Information All required source
    code is included in testCoco.zip. All dependencies are specified in flake.nix.
    The file testCoco-docker-before-setup.tar.gz is generated by: Running nix build
    . in a directory containing flake.nix, and Placing the extracted contents of testCoco.zip
    into the root directory of the resulting environment.'
