  abstract: 'This release focuses on improving reproducibility, container build expressiveness,
    and documentation in preparation for the JOSS submission. Highlights Enhanced
    Docker build support with proper COPY handling and BuildKit RUN --mount support,
    including SSH agent forwarding. Added Nix support to enable fully reproducible
    development and build environments. Improved QEMU and profiling examples, including
    reliable networking and minimal Intel VTune integration. Documentation updates
    and cleanup following JOSS reviewer feedback. For full details, see the CHANGELOG.
