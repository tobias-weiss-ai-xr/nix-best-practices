  abstract: 'Since I wrote about the new ATProto-powered Tangled Git forge a few months
    ago, it''s come along by leaps and bounds! First, and most excitingly, they''ve
    added continuous integration via Spindles which are built in a nice ATProto style:
    The pipelines are Nix-only right now, so I braved using it [1] for a new GPS Exchange
    Format library in OCaml that I wrote.'
