- title: The Virtual Recency Abstraction (Artifact and Supplementary Material)
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19704087
  category: nix-containers
  subcategory: method
  authors:
  - Sven Keidel
  - Raphaël Monat
  - Sebastian Erdweg
  abstract: 'Artifact and Supplementary Material for "The Virtual Recency Abstraction
    (Strong Updates for Abstract Interpreters with Shared State)" Scope This artifact
    contains instructions to reproduce Figures 2 and 3 in Section 5 Table 1 in Section
    6.1 Figure 4 in Section 6.2 Table 2 in Section 6.3 Content The artifact contains
    source code for the Tip and Wasm analyses described in the paper, as well as evaluation
    scripts that reproduce the graphs in Sections 5 and 6. Figure 2: Modularity and
    Reuse The source code of the Tip analysis can be found in `/evaluation/sturdy.scala/sturdy-tip/src/main/scala/sturdy/language/tip/analysis/RelationalAnalysis.scala`
    The figure is generated with Jupyter notebook `count_reuse.ipynb` Figure 3: Modularity
    and Reuse The source code of the Wasm analysis can be found in `~/evaluation/sturdy.scala/sturdy-wasm/src/main/scala/sturdy/language/wasm/analyses/RelationalAnalysis.scala`.
    The figure is generated with Jupyter notebook `count_reuse.ipynb` Table 1: Soundness
    of the Relational Wasm Analysis The source code of the WebAssembly 1.0 specification
    test suite can be found in `/evaluation/sturdy.scala/sturdy-wasm/src/test/resources/sturdy/language/wasm/spec-test-suite-wasm1/`.
    The scala test harness can be found in `/evaluation/sturdy.scala/sturdy-wasm/src/test/scala/sturdy/language/wasm/specification/RelationalAnalysisTestScript.scala`.
    The data is written in CSV format to `/evaluation/sturdy.scala/soundness.csv`
    The table is generated with Jupyter notebook `soundness.ipynb` Figure 4: Scalability
    of the Relational Wasm Analysis The benchmarks can be found in `/evaluation/sturdy.scala/sturdy-wasm/src/test/resources/sturdy/language/wasm/benchmarksgame/src`.
    The Scala test harness can be found in `/evaluation/sturdy.scala/sturdy-wasm/src/test/scala/sturdy/language/wasm/benchmarksgame/BenchmarksgameRelationalPerformanceTest.scala`
    The data is written in CSV format to `/evaluation/sturdy.scala/scalability.csv`
    The figure is generated with Jupyter notebook `scalability.ipynb` Table 2: Precision
    of the Relational Wasm Analysis The WebAssembly code of the precision test can
    be found in `/evaluation/sturdy.scala/sturdy-wasm/src/test/resources/sturdy/language/wasm/precision.wast`.
    The C code of the precision test can be found in `/evaluation/sturdy.scala/sturdy-wasm/src/test/resources/sturdy/language/wasm/precision.c`.
    The data is written in CSV format to `/evaluation/sturdy.scala/precision.csv`,
    `/evaluation/goblint/precision.csv`, `/evaluation/mopsa/precision.csv`. The table
    is generated with Jupyter notebook `precision.ipynb`. Reusability The source code
    of the analyses presented in this paper is open-source and available on GitHub
    (https://github.com/sturdy-analysis/sturdy/tree/relational-wasm). The code can
    be recompiled using the Scala built tool SBT and the nix package manager:git clone
    --recursive https://github.com/sturdy-analysis/sturdycd sturdygit checkout relational-wasmcd
    sturdy-apronnix build .#numerical-analysis-librariesln -s result/lib libcd ..sbt
    compileWe recommend to develop the analyses within the IntelliJ IDE. Getting Started
    To get started, first load the docker image of the artifact:docker load -i virtual-recency-abstraction.tar.gzdocker
    load -i goblint/goblint.tardocker load -i mopsa/mopsa.tarThen start the docker
    container:docker run -it --rm -p 8888:8888 virtual-recency-abstraction:latestOpen
    the link http://127.0.0.1:8888/tree?token=... shown in the command line output
    in a web browser. This will open Jupyter included in the docker image.Within Jupyter
    file browser, open the `soundness.ipynb` notebook.Evaluate each cells in the order
    how they appear in the notebook with `ctrl+enter`. Alternative press the fast-forward
    button (⏩). To get shell access to the container rundocker run -it --rm --entrypoint
    bash virtual-recency-abstraction:latest Platforms The artifact is built for X86
    CPU architecture and has been tested on linux devices.Since the artifact contains
    compiled native code, it cannot be executed on other CPU architectures, such as
    ARM-based Macs. We ran the benchmarks (Figure 4) on a machine with an AMD Ryzen
    Threadripper PRO 5975WX CPU, Ubuntu 24.0, and OpenJDK 21.0.9 with 100GB heap space
    and 1GB stack space.For the artifact we excluded benchmarks for Polyhedra and
    Octagons, such that the experiment runs with 8GB RAM. Appendix Figures 2 and 3:
    Modularity and Reuse Figures 2 and 3 can be reproduced with Jupyter notebook `count_reuse.ipynb`:
    Open the Jupyter notebook `count_reuse.ipynb` following the steps in the getting
    started section. Reexecute each cell in the order how they appear in the notebook
    with `ctrl+enter`. Alternative press the fast-forward button (⏩). The cells return
    latex commands we used to generate Figures 2 and 3 in our paper. Table 1: Soundness
    of the Relational Wasm Analysis Please note that the analysis of `float_exprs.wast`
    requires a lot of RAM. Therefore, we recommend the reviewers exclude this test.
    This is explained in more detail in the Jupyter notebook. Table 1 can be reproduced
    with Jupyter notebook `soundness.ipynb`: Open notebook `soundness.ipynb` following
    the steps in the getting started section. Reexecute each cell in the order how
    they appear in the notebook with `ctrl+enter`. Alternative press the fast-forward
    button (⏩). Table 1 can be found at the bottom of the notebook. Figure 4: Scalability
    of the Relational Wasm Analysis Please note that the benchmarks for Polyhedra
    and Octagons require a lot of RAM to run. We ran the benchmarks on a machine with
    100GB RAM. Therefore, we recommend the reviewers only reexecute the benchmarks
    for intervals. This is explained in more detail in the Jupyter notebook. Figure
    4 can be reproduced with Jupyter notebook `scalability.ipynb`. Open notebook `scalability.ipynb`
    following the steps in the getting started section. Reexecute each cell in the
    order how they appear in the notebook with `ctrl+enter`. Alternative press the
    fast-forward button (⏩). The parts of Figure 4 can be found within the evaluated
    notebook. Table 2: Precision of the Relational Wasm Analysis To repeat the precision
    tests with the MOPSA analyzer run on the host machine:cd goblintdocker load -i
    goblint.tardocker run -it --rm -v $(pwd):/data --workdir=/data --entrypoint bash
    ghcr.io/goblint/analyzer ./analyze_tests.sh To repeat the precision tests with
    the MOPSA analyzer run on the host machine:cd mopsadocker load -i mopsa.tardocker
    run --rm -it --mount type=bind,src=`pwd`,target=/home/mopsa/workspace --workdir=/home/mopsa/workspace
    mopsa/mopsa-analyzer ./analyze_tests.sh Table 2 can be reproduced with Jupyter
    notebook `precision.ipynb` Open notebook `precision.ipynb` following the steps
    in the getting started section. Reexecute each cell in the order how they appear
    in the notebook with `ctrl+enter`. Alternative press the fast-forward button (⏩).
    Table 2 can be found at the bottom of the evaluated notebook.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
