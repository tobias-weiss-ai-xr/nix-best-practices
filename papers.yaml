- title: 'Urban Archipelago: An Environmental History of the Boston Harbor Islands
    by Pavla Šimková'
  date: 2026-01
  url: https://doi.org/10.1162/jinh.r.2059
  category: nix-development
  subcategory: ''
  authors:
  - Laura Dierksmeier
  abstract: 'Šimková’s Urban Archipelago is an elegantly argued contribution to environmental
    history, urban history, and the interdisciplinary field of island studies. Focusing
    on the Boston Harbor Islands, Šimková challenges the long-standing dichotomy between
    city and nature. By tracing how the islands were used, imagined, polluted, protected,
    and reclaimed, she shows the entanglements of ecological and urban processes across
    four centuries.The book succeeds in turning often-overlooked landmasses into a
    lens for understanding broader dynamics of urban expansion, waste management,
    public health, exclusion, and conservation. The author brings to life the shifting
    meanings of the islands, such as sites of quarantine, incarceration, recreation,
    and restoration, grounding her account in archival sources and oral histories.
    Sources range from pilgrim chronicles and board of health reports to newspapers,
    contracts, development plans, maps, and archaeological surveys. The breadth of
    evidence allows her to demonstrating how the decisions of settlers, planners,
    politicians, entrepreneurs, and activists reshaped both the islands and the surrounding
    metropolis.One of the book’s strengths lies in its attention to the political
    ecology of marginal spaces. In the seventeenth century, deforestation and gravel
    extraction left the islands vulnerable to erosion, causing Deer Island and Nixes
    Mate nearly to disappear. “The more the port of Boston expanded, the more the
    harbor islands shrunk” (44). Yet the islands were not just spaces defined by exploitation
    from afar. The people who lived there took great delight in their gardens, flowers,
    and swimming spots, and the popularity of the skating pond on Spectacle Island
    contradicted the mainland perception of Spectacle as Boston’s refuse site. Šimková
    illustrates how places could hold contradictory meanings and functions simultaneously.She
    also refuses to romanticize the islands, describing them as dumping grounds for
    the urban poor, prisoners, patients with contagious diseases, and the city’s waste.
    With meticulous detail, she recounts the waste businesses on Spectacle, including
    the rendering of dead animals, especially horses in the nineteenth century, into
    grease, candles, soap, glue, fertilizer, and dog food. “The island became the
    default solution for relocating the city’s nuisances” (71). But relocation was
    never final; tides returned refuse to Boston’s shores, underscoring the limits
    of treating islands as disposable.Meanwhile, the mainland struggled to see the
    islands as anything other than functional spaces. “Leaving them alone felt like
    failing to collect revenue that the city was rightfully due” (112). Developers
    and planners proposed housing, airport extensions, and even a site for the 1975
    World’s Fair. One designer of the failed World’s Fair plan captured the tension
    between urban pragmatism and island exceptionalism: “The city of tomorrow on its
    island site will be physically as well as conceptually a world unto itself. …
    Between it and the mainland there will be a border; to cross it will be an experience
    in itself” (121). As Šimková shows, the islands were conceived as places of special
    use, but never separate from the city that depended on them.The narrative culminates
    in a shift from exploitation to conservation. Beginning in the 1970s, groups such
    as “Friends of the Boston Harbor Islands” (1979) and “Save the Bay” (1986) pressed
    for preservation. “Within only a decade, the islands went from Boston’s dumping
    ground … to places that it seemed almost a crime not to protect and cherish as
    natural enclaves and cultural heritage” (175). Congressional designation of the
    Boston Harbor Islands as a national recreation area in 1996 marked the culmination
    of decades of advocacy, aimed especially at providing public space for those “who
    could not afford exotic vacations” (195). On Spectacle Island, this initiative
    meant reconstructing the landscape and erasing much of its waste-processing past:
    “Reminders of its past as a working landscape were largely unwelcome” (203). Today,
    visitors encounter a scenic park, while the island’s longer history remains obscured,
    making Šimková’s book all the more valuable.Urban Archipelago is a meticulously
    researched and beautifully written study that will resonate with historians of
    environment, cities, and social life. By situating the Boston Harbor Islands at
    the intersection of urban and ecological histories, Šimková demonstrates that
    islands, even those in the shadows of skyscrapers, were integral to the making
    of metropolitan Boston.'
  venue: The Journal of Interdisciplinary History
- title: 'What We Can Learn from an Olympics That Never Happened: A Review Essay of
    Adam Berg, The Olympics That Never Happened'
  date: 2025-01
  url: https://doi.org/10.5406/26396025.6.1.07
  category: nix-development
  subcategory: ''
  authors:
  - Matthew J. Burbank
  abstract: 'Why a book about an Olympics that never actually occurred? The reason,
    as Adam Berg''s terrific book illustrates, is that there is a lot to be learned
    about growth and resistance to growth by examining how and why a city pursues
    the Olympics—even an Olympics that never was. Berg''s carefully crafted narrative
    tells the story of how Denver pursued the 1976 Olympic Games, how the city won
    the International Olympic Committee''s (IOC) bidding contest, and how and why
    opposition emerged that ultimately led to successful referenda, both state and
    citywide, preventing public funds from being used to host the Games. Although
    this book is a case study of a single American city, it does a masterful job of
    illuminating how Olympic bids come together, how these bids are intricately intertwined
    in local politics, how opponents can emerge, and how the politics of urban growth
    plays out in the American context generally.Fittingly for events that occurred
    primarily in the 1960s and 1970s, Berg approaches the Denver Olympic bid from
    a historical perspective, drawing heavily on archival materials from city, state,
    and IOC sources as well as media reports. Berg makes use of existing oral histories
    with Denver Olympic proponents and conducted his own interviews with key actors
    who opposed public funding for the 1976 Winter Games. Berg''s work draws on the
    extensive research on sports tourism, economic development and the Olympics, and
    development in Colorado and the American West. What emerges is a book that is
    both scholarly and captivating as Berg''s narrative traverses the politics of
    economic growth in Colorado, racial and ethnic inequities in Denver, an emerging
    environmental movement, a tax revolt, and demands for greater democratic participation.
    For these reasons, this book will be of interest to scholars, students, and activists
    interested in the Olympics, urban politics, economic development, social movements,
    or democratic politics.Berg opens with the story of economic development in Colorado
    and its capital city of Denver. The dream of hosting the Olympics emerged from
    an urban growth coalition featuring local business leaders and politicians and
    the desire to draw tourists to the area to spark development in the emerging ski
    industry. The bid for the 1976 games began in earnest in 1963 when “investors
    in ski resorts, bankers, utility providers, construction companies, politicians
    at all levels, newspaper editors, and others worked in unison to bring the sports
    mega-event to the state” (25). Berg makes effective use of Clarence Stone''s concept
    of an “urban growth regime” to identify the key actors present as part of the
    effort to bring the Olympics to Denver to promote growth in the city and region.1
    A growth regime, in Stone''s view, is a loose network of business leaders and
    local and state elected officials who desire economic development and see it as
    good business and good politics. “While the business community provided the impetus
    for Denver''s Olympic bid, counterparts in the public sector remained essential.
    Although private and public funds paid for Denver''s forthcoming attempt to gain
    the games, the bidders always expected public financing to carry the brunt of
    the load when it came time to actually run the show” (32). As Berg notes of the
    members of the growth regime: “They were business partners, associates, and probably
    friends, with a shared sense of entitlement in their political authority and trust
    in one another, as well as a common understanding of the promise of skiing, the
    potential of the games, and the mutual benefits of growth” (39).The Olympic bid
    was created and promoted by the Denver Organizing Committee (DOC). While all Olympic
    bids tell a story that is too good to be true, a striking feature of the Denver
    Games was just how willing the local bid committee was to “fake” an Olympic city:
    “Colorado''s Olympic bid for the 1976 Winter Games had no basis in reality. It
    was designed purely to satisfy the IOC and represented probably the most dishonest
    proposal in Olympic history” (40). To lay claim to the “most dishonest” Olympic
    bid is a bold assertion, but Berg backs it up with clear evidence of how the DOC
    presented false, misleading, or exaggerated information about locations that were
    not suitable to be Olympic venues and financing that was uncertain at best. Later
    in the book, Berg details an even more astounding contention that far from the
    Denver bidders duping the IOC, the organization''s president at the time, Avery
    Brundage, appeared to have known about the problems but hoped to use Denver''s
    dodgy bid for his own purposes. “In truth, Brundage''s behavior appears consistent
    with the hope that the DOC would crash, burn, and consume the entire Winter Olympics”
    (145). Brundage preferred that the Olympics should be only the summer games with
    no winter sports event: “Brundage would use his last speech as IOC president,
    at the 1972 Munich Summer Games, to recommend the Winter Olympics—meaning the
    institution as a whole—be ‘given a decent burial in Denver’” (145).Despite the
    problems with its bid—or perhaps because of them—Denver won the IOC vote for the
    1976 Winter Games in May 1970. As Berg points out, historical context is important
    as the Denver Games were secured during the period before Montreal went heavily
    into debt hosting the 1976 Summer Games and well before Los Angeles showed American
    cities in 1984 how to host the Games with corporate sponsors paying the bills
    instead of local taxpayers. The assumption of Olympic bidders in Denver was that
    most of the costs of hosting a future event would be paid for by state, local,
    and federal taxpayers. “The DOC and its supporters desired Olympic spectators,
    publicity, new sports facilities, and tourists. However, they also grasped that
    it would not be wise to host the games if they themselves had to pay for it” (55).The
    issue of how the Games would be financed ultimately led to the demise of the Denver
    ’76 Olympics. Yet local opposition to the Denver Games emerged from various sources
    with varying degrees of intensity. Berg argues that there were three primary sources
    of discontent with the DOC and its plans for the Olympics: minoritized residents
    in urban Denver, middle-class residents of exurban areas, and aspiring politicians
    who raised difficult questions about who would pay for the Games and how decisions
    about Colorado''s future should be made.In an era of post-civil rights and federally
    funded urban renewal, Berg argues that “Brown and Black residents of Denver came
    to see the Winter Olympics as a vehicle for combating these challenges. The question
    at first was not whether Denver should host the Games. Instead, the city''s minoritized
    citizens wondered how to use the event to their advantage. Whereas the DOC meant
    to enhance the wealth of Colorado powerbrokers through tourism and commercial
    growth, Denverites of color ultimately looked to gain access to Olympic planning
    to address a systematic housing shortage that threatened low-income families”
    (71). One manifestation of this discontent with the Olympics when there were more
    pressing problems impacting Denver residents was the creation of a group called
    Citizens Interested in Equitable Olympics (CIEO): “As CIEO declared, its goal
    was to advocate for ‘black and brown participation’ in the planning of the games”
    (77–78). CIEO attempted to get the mayor of Denver to reconstitute the DOC with
    representatives chosen from the Brown and Black communities in Denver. While CIEO
    was an important entry into coalition and identity politics, it did not enjoy
    the support of more pragmatic community activists and ultimately was not especially
    successful. “Nevertheless,” Berg writes, “Chicanos, Black Panthers, moderate politicians,
    pragmatic community leaders, and others held two things in common. Each recognized
    the political capital that the games created, and all involved thus tried to appropriate
    the event to highlight and address ethnic and racial marginalization manifested
    through the dire state of housing options. Albeit in different and sometimes conflicting
    ways, Mexican Americans and African Americans in the Mile High City aimed to use
    the Olympics to remedy an urgent civic challenge” (87–88).Another source of local
    Olympic resistance came from “white middle-class exurbanites in the Jefferson
    County foothills west of the city” (89). Like the urban residents of Denver, these
    folks were not against the Olympics initially but were intent on enjoying their
    semi-rural lifestyle and did not want to see growth, tourists, or Olympic development
    around them. But, “with Nordic skiing, bobsled, luge, and ski jumping events slated
    for their area, they became ardent DOC adversaries, embodying an obstinate and
    unyielding environmental stance, which melded the language of ecology with notions
    of social class, aesthetic value, and expectations for self-determination” (89).
    One example of this emergent environmental opposition was the creation of an organization
    called Protect Our Mountain Environment (POME). POME and other groups helped to
    articulate the case against the development of Olympic venues in their area and
    became one of the key constituents seeking to get a proposal on the ballot to
    prohibit taxpayer money from being spent on the Olympics. As Berg concludes, “middle-class
    environmentalism was far from the only reason Coloradans voted to banish the Olympics.
    The foothills-born grassroots undertaking could not have caused that result on
    its own. However, it became one of the essential pieces. . . . For many Coloradans,
    excessive costs and DOC dishonesty became the primary motives for wanting to nix
    the games. Yet concerns about environmental damage brought the issue to the forefront
    for many” (105–6).A third, and crucial, element of what became the movement to
    stop taxpayer funding for the Denver Olympics was the involvement of aspiring
    politicians. Two recently elected Democratic members of the Colorado state legislature,
    Richard Lamm and Robert Jackson, started as supporters of the Denver Games but
    began to question the costs and later the merits of hosting the Olympics at all.
    Supporters of Lamm and Jackson created Citizens for Colorado''s Future (CCF),
    an organization that would become critical to turning Olympic discontent into
    political action. “CCF embraced the role of coalition-builder,” Berg writes, “hoping
    to mold those aggrieved by the DOC''s action toward a common end. . . . CCF aimed
    to appeal to minoritized Denverites, well-off exurbanites, tax revolters, and
    especially a population it described as ‘Middle America.’ CCF thus positioned
    itself as a moderate and mature organization while arguing that the Winter Games
    represented foremost a subversion of democracy undertaken by a collection of wealth-seeking
    elites. Through such means, the group enabled a viewpoint that allowed Coloradans
    to override the DOC''s Olympic intentions” (123).Like other parts of the coalition,
    the founders of CCF were not anti-Olympics, although they did share concerns over
    socioeconomic inequality in Denver, potential environmental degradation, and profligate
    spending of taxpayer money.2 “The CCF leaders had no hard feelings toward the
    games generally. They were not even that concerned with its direct consequences
    on Colorado. . . . [F]or them, these matters fed into larger aspirations” (126).
    Those larger aspirations were a desire to change politics in a more inclusive
    and participatory direction. Based on the interviews conducted with leaders of
    this group, Berg states that “each conveyed a desire to import genuine democratic
    practices into Colorado, challenge the state''s political authorities, and reorient
    its overall trajectory” (126–27). For the leaders of CCF, the goal was not primarily
    to stop the Olympics but rather to employ discontent about taxpayer spending on
    the event to create a coalition to pursue a more democratic style of politics.The
    opposition coalition was successful in getting an initiative to prohibit state
    taxpayer funding on the statewide ballot in 1972 and a similar initiative on the
    ballot in Denver. The voters of Colorado and in the city of Denver passed the
    initiatives; in a stunning development, a loose coalition of civically minded
    Olympic malcontents had won and the embodiment of the growth regime—the Denver
    Olympic Organizing Committee—had lost. “The Denver Olympics would not bring the
    people of the world together. Instead, it created a multifaceted alliance of Coloradans
    who successfully undercut an advertising project produced by a governing regime
    that included Colorado''s governor, Denver''s mayor, and the state''s most influential
    businesspeople. In the context of Colorado''s history, the DOC had suffered a
    stunning defeat” (170). Though CCF''s victory was impressive, it came with a cost
    to the least powerful elements of the coalition: “Within CCF''s initiative to
    defeat the DOC, allusions to racial justice and fair housing became a relatively
    silent—or, perhaps more accurately, silenced—partner. The specific issues impacting
    Mexican Americans and African Americans took a back seat to fears of environmental
    damage, unjust taxation, and generalized worries about the integrity of citizenship”
    (158).The coalition created by CCF sought to change politics in Colorado. While
    this opposition coalition gained some short-term victories, Berg concludes that
    they were not successful in bringing about the goals of their larger political
    project. One short-term win was that there was no taxpayer-funded Olympics and
    no white-elephant venues to deal with. After the results on the initiatives were
    known, the IOC moved the 1976 Winter Games to Innsbruck, Austria, location of
    the 1964 Winter Games. A second victory for Olympic opponents was that Richard
    Lamm ran for governor of Colorado in 1974 and won. Lamm adapted the CCF leadership
    into a ready-made campaign organization and used the issues raised during the
    anti-spending initiative campaign to propel himself into the governor''s office.
    Even with Lamm''s victory, the desire to remake Colorado politics did not go far.
    As Berg summarizes: “any trace of the cohesiveness required to break up or even
    check Colorado''s traditional regime evaporated. . . . The Olympic Games had enabled
    activists to contend momentarily with the Colorado growth network. It did draw
    together diverse groups who similarly couched anti-Olympics advocacy in discourses
    of citizenship and democracy. But many of the central parties involved arrived
    at their Olympic stances due to different underlying motivations. Their agendas
    were discrete and their unity episodic. . . . [A]s a whole they proved ill-suited
    to exert an equivalent collective influence on the future” (171–72). In sum, Berg
    concludes that “anti-Olympic activists with far-reaching intentions should remain
    wary. One ought not to confuse strength gained through anti-Olympic pacts with
    the authentic, purposeful, and long-lasting partnerships needed for deep-seated
    change. The legacy of Denver ’76 is multifaceted, but a part of the lesson is
    that a common enemy does not mean a common cause” (188).The events surrounding
    the Denver ’76 Olympics had an important impact on the politics of growth in Denver
    and Colorado. But do the events so richly described in Berg''s book tell us anything
    more broadly about cities, growth, and the Olympics? To put it another way, did
    the truncated Denver Olympics leave a legacy? My sense is that the story of the
    Denver Olympics underscores a couple of significant observations about growth
    politics in American cities. One is that in Denver and in other American cities,
    growth regimes are still central to the development dynamic and are still difficult
    to defeat when it comes to matters of local economic development. It is true that
    some of the key players have changed between the era Berg describes in Denver
    and today. For example, local print newspapers no longer dominate the media environment
    and globalization has changed the ownership of utility and construction companies
    and thus the roles they play in encouraging growth in local economies. As Berg
    describes in the epilogue, the Denver growth regime is no longer the classic set
    of movers and shakers that they were in the 1960s and local political leaders
    have changed to reflect, among other things, the growing importance of Latino
    voters in cities like Denver. Still, as the development of Coors Field for a new
    Major League Baseball team in Denver illustrated, the network of business and
    political leaders was still vital to getting deals done and proponents of growth
    clearly learned from having lost the Olympic funding initiative. Which is to say—in
    Denver and in other American cities—the growth imperative continues, and proponents
    of growth continue to learn and adapt to changing circumstances.A second observation
    that Denver''s story illustrates is the potential for change among Olympic opponents.
    As Berg''s narrative makes clear, local discontent with the bid or its impact
    was framed not in terms of opposition to the Olympics themselves. Rather opposition
    came in the form of disparate groups who objected to inequality in housing, the
    environmental impact on specific locales, or the costs to be borne by the taxpayer
    of staging a large-scale sporting event. Once the Games were gone, there was little
    reason for the coalition of opponents to continue to work together. Yet again,
    as Berg notes in the epilogue, the nature of opposition to hosting the Games is
    also changing. “Anti-Olympic groups are calling out the predatory structures,
    behaviors, and practices of capital and the state—practices that these groups
    claim are increasing inequality and the precarity of everyday urban life.”3 In
    the period since the Denver Olympics first raised the issues in the American context,
    concerns about the costs and benefits of holding an Olympic mega-event have been
    more robustly articulated in a number of cities around the world including Boston,
    Budapest, Chicago, Calgary, Hamburg, Munich, Oslo, and Rome where bid proposals
    have been withdrawn, voted down, or quietly dropped.4As growth proponents have
    learned and adapted, so too have opponents. Opponents have learned to find common
    ground and share knowledge in a transnational fashion about what issues and protest
    techniques work and by making the Olympics themselves central to questions about
    who benefits and to what end. Although the opposition coalition in Colorado in
    the 1970s was not successful in fundamentally changing how decisions about growth
    policy were made, it remains to be seen whether more recent transnational opposition
    groups may be able to do so.'
