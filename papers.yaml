- title: Sex-disaggregated analysis of neutropenic fever in high-risk patients with
    hematological malignancies - a pooled re-analysis - analysis code
  date: 2025-10
  url: https://doi.org/10.5281/zenodo.17416061
  category: nix-flakes
  subcategory: ''
  authors:
  - Seltmann, Alva
  - Sachs, Tobias
  abstract: 'Analysis code in R accompanying the paper "Sex-disaggregated analysis
    of neutropenic fever in high-risk patients with hematological malignancies - a
    pooled re-analysis" by Alva Seltmann, Tobias Sachs, Karin Mayer, Corinna Hahn-Ast,
    Annamaria Brioli, Maria Madeleine Rüthrich, Peter Brossart, Andreas Hochhaus and
    Marie von Lilienfeld-Toal. Reproducible Environment Setup The original environment
    was set up using conda / mamba and the conda-env.yml file. After setting up conda
    / mamba on your system, navigate to the project directory containing conda-env.yml
    and use conda env create -f conda-env.yml to create the conda environment. For
    further details, check the conda documentation. Alternatively, we provide an environment
    setup via a nix flake. After setting up nix on your system, navigate to the project
    directory containing flake.nix and set up the environment andautostart a jupyter
    lab instance via nix develop For further details, check the nix documentation.
    Note: While constructing the nix flake, there were some build problems using the
    exact versions given in the original conda environment, thus we had to move to
    R 4.5.0. Also, some minor version differences are possible (e.g. officer 0.6.9
    instead of 0.6.8). All results were reproducible using both approaches. Literate
    org mode document The analysis files are provided in the src-R directory. Additionally,
    we provide a literate org mode document (feb-neutro-reproduce.org) which references
    these scripts (via "transclusion", see the org-transclusion repository) and executes
    jupyter-R source blocks (see the emacs-jupyter repository). The org document provides
    an interactive way of executing scripts and saving the output, simular to a jupyter
    notebook. It also annotates the source files and makes it clear in which order
    to execute them to get to the desired outputs. For further details, check the
    org-mode documentation. Additionally, we provide a HTML export of the document
    (feb-neutro-reproduce.html), which is not interactive, but provides an easily
    accessible view of the literate document. Open this file in any browser. Output
    files We currently provide the raw .rds files of the tables, as well as the supplementary
    correlation plots in this repository. For .docx outputs and main and supplementary
    figures, we refer to the connected publication.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Open science falling behind in the era of artificial intelligence
  date: 2025-07
  url: https://doi.org/10.3389/frma.2025.1595824
  category: nix-devops
  subcategory: ''
  authors:
  - Guanxiong Pei
  - Huajian Huang
  abstract: 'Generative Artificial Intelligence (AI) refers to a new generation of
    content generation technologies that emerged after the rise of Transformer architecture
    in 2017, characterized by its core technical features of "compute-intensive architecture,
    model-driven paradigm, and data closed-loop system" (Table 1). AI is accelerating
    scientific discoveries and reshaping the research process, propelling AI for science
    towards becoming a novel research paradigm. There is a pressing demand for open
    science due to these advancements, yet the development of open science lags considerably
    behind the AI era. This disparity arises from the loss of academic leadership
    and insufficient motivation to pursue openness within the industrial sector, which
    could hinder AI empowerment and scientific innovation. Effective intervention
    by the public sector and policymakers becomes crucial when the "invisible hand"
    fails.A new stage of open scienceAI technology has given rise to AI for science
    as a new research paradigm and pushed open science from the consensus-based 1.0
    stage into the platform-based 2.0 stage (Table 1). How?First, the data and computational
    resources needed to train competitive scientific models are increasing rapidly,
    as seen in fields such as materials science (Lei et al., 2024), quantum computing
    (Huang et al., 2023), and weather forecasting (Conklin and Kumar, 2023), among
    others. It is impractical for individual research teams to independently deploy
    large-scale computing power and construct high-quality scientific databases and
    corpora. This necessitates the development of open scientific infrastructure that
    integrates computing power, data, and models into a unified supply system. Such
    infrastructure would enable the efficient organization of scientific innovation
    resources, enhance the overall quality and efficiency of AI resources, reduce
    operational costs, and minimize redundant efforts. Much like electricity or the
    internet, this new infrastructure will become an essential public good.Second,
    responsible and trustworthy AI urgently requires a more open and transparent environment
    for model development. The proprietary nature of many AI models and the uncertain
    origins of their training data have raised concerns about the reproducibility,
    fairness, and reliability of AI-enabled scientific research. A majority of scientists
    (55%) have expressed concerns that AI model deployment may facilitate fraud (Van
    Noorden and Perkel, 2023). There is an urgent need to establish a more open and
    transparent environment for model development, providing avenues for public scrutiny,
    opportunities for result reproducibility and validation, and avenues for model
    refinement (Aspesi and Brand, 2020; Wang et al., 2023). These efforts aim to foster
    high-quality, replicable, and responsible research. According to research data
    from the Hugging Face platform, open model development is showing explosive growth
    trends. As of the end of August 2023, the number of pre-trained models on the
    platform has achieved leapfrog growth, skyrocketing from a cumulative total of
    100,000 to over 300,000; the dataset scale has also expanded simultaneously, increasing
    from 10,000 to 58,000. This trend is equally evident in the scientific community:
    the Materials Project platform in materials science has made quantum mechanics
    calculation datasets accessible for over 154,000 inorganic compounds, thereby
    supporting global researchers in the development of new materials (Riebesell et
    al., 2023). Meanwhile, the Protein Data Bank (PDB) in structural biology has shared
    more than 220,000 three-dimensional protein structure datasets through standardized
    formats, providing essential foundational data for AI-driven drug discovery research
    (Liu et al., 2024).Third, AI for science is inherently interdisciplinary. The
    primary motivation for the classification of disciplines lies in human cognitive
    limitations, and with the advancement of AI research tools, human understanding
    of the world will tend to be integrated. However, differences in knowledge systems
    and thinking habits create barriers between AI experts and domain scientists and
    require innovative collaboration models and the removal of walls between disciplines.
    This transformation fundamentally shifts research organizational paradigms from
    closed, fragmented small workshops to open, collaborative large platforms. Open
    science platforms enable AI experts to provide AI research tools and training
    and enable other experts to share domain-specific knowledge. This bidirectional
    collaborative approach aids in breaking down disciplinary barriers.The problem
    of industry dominanceIndustry is becoming increasingly influential compared to
    academia. It dominates three key elements of AI research: computing power (Ali
    et al., 2025), large datasets (Hartmann and Henkel, 2020), and highly skilled
    researchers (Ahmed et al., 2023). According to the Artificial Intelligence Index
    Report 2025, industry developed 55 notable AI models. In contrast, academia released
    none (HAI, 2025). Furthermore, the rate at which AI doctoral graduates in the
    United States are migrating to industry continues to accelerate. In 2011, new
    AI PhDs took jobs in industry (40.9%) and academia (41.6%) in roughly equal proportions.
    However, by 2022, a considerably larger proportion (70.7%) chose industry compared
    to academia (20.0%) (Ahmed et al., 2023). With extremely high salaries and expensive
    computing power to back them up, technology giants around the world are attracting
    top talent and producing world-shaking achievements such as AlphaFold and ChatGPT.
    Such a profound and systemic change is taking place that the "godmother of AI"
    Fei-Fei Li has made an urgent appeal to US President Joe Biden for funding to
    prevent Silicon Valley from pricing academics out of AI research (Nix et al.,
    2024). Why is industry dominance problematic?Industrial innovators may seek to
    erect barriers by controlling computing resources and datasets, closing off source
    code, and making models proprietary to maintain their competitive advantage. This
    closed strategy stems from the fundamental conflict between industry''s pursuit
    of maximizing shareholder value and academia''s commitment to public knowledge
    sharing, though concerns about potential risks introduced by model open-sourcing
    also play a role. For instance, releasing model weights may create risks of AI
    misuse (Kim et al., 2025). While such risks could be mitigated through technical
    approaches like federated learning (Xu et al., 2020), these safety measures might
    increase model development costs. After weighing the scientific value of openness
    against commercial risks, industry continues to prioritize proprietary control
    over open science principles. These entities generally lack interest in creating
    public scientific goods and often exclude scientists not driven by shareholder
    value from AI research endeavors.Notably, open science practices are not without
    benefits. Taking talent acquisition as an example, after Meta open-sourced LLaMA
    and LLaMA 2, it attracted top AI researchers from Google DeepMind, OpenAI, and
    academia, with many open-source contributors eventually joining Meta''s AI teams.
    Concurrently, over 100,000 derivative models based on LLaMA emerged on Hugging
    Face, fostering a robust developer ecosystem. While many companies recognize that
    openness can yield long-term competitive advantages—such as attracting talent,
    fostering synergy between industry and academia, and building robust ecosystems—they
    often choose closed approaches motivated by short-term commercial interests, including
    the protection of proprietary technologies and the pursuit of first-mover advantages.
    This "knowing-but-not-doing" paradox highlights the fundamental conflict between
    research ethics and business logic.Lack of resources in academia and lack of motivation
    in industry may slow the open science process and hinder the value output of AI
    for science. According to the Artificial Intelligence Index Report 2024, while
    65.7% of foundational models were open-source in 2023—an increase from 44.4% in
    2022—the highest-performing models, such as GPT-4 and Gemini Ultra, continue to
    be predominantly closed-source and controlled by industry players (HAI, 2024).
    A survey of 1,600 scientists highlighted lack of computational resources, funding
    for research activities, and access to scientific platforms and high-quality data
    essential for AI applications (Van Noorden and Perkel, 2023). A number of important
    studies are hampered by the lack of access to advanced models. Large-scale and
    powerful AI models and tools are often proprietary, large amounts of valuable
    data are stored in repositories with restricted access, incompatible software
    formats hinder scientific collaboration, complex communication channels delay
    knowledge sharing, and AI tools are relatively expensive to use, with only a fraction
    of researchers being able to access the resources and afford the associated costs.Recommendations
    for policymakersA systematic policy framework in two dimensions is proposed. Vertically,
    synergies are formed between top-down AI for science cloud infrastructure initiatives
    driven by the public sector and bottom-up efforts to cultivate a widespread awareness
    of open science. Horizontally, incentive policies act as accelerators while governance
    policies serve as safeguards to ensure efficient and reliable operation.Top-down
    initiatives: AI for science cloud infrastructureUNESCO''s initiative calls on
    the public sector to play a leading role in implementing open science (Das, 2021),
    and initiatives like the White House Office of Science and Technology Policy (OSTP)
    Memo on Advancing Open Science reinforce this mandate. International organizations
    play a crucial role in enabling open data sharing by fostering the necessary technical
    and social infrastructures; the Research Data Alliance (RDA) exemplifies this
    by building the vital bridges. Now is the time to develop AI for science cloud
    infrastructure to enhance equitable access to AI technologies, resources, and
    tools. Our recommendations are: (a) Establish an AI resource base aggregating
    computing power (e.g., GPU clusters), scientific datasets, pre-trained models,
    and software tools tailored to scientific research. This addresses common issues
    such as insufficient large-scale and high-performance computing capabilities and
    the scarcity of high-quality scientific datasets, and achieves the large-scale
    aggregation, high-efficiency allocation, and open sharing of AI public research
    resources. This infrastructure should be designed and operated in accordance with
    the FAIR Data Principles (Wilkinson et al., 2016) to maximize the discoverability,
    accessibility, interoperability, and reusability of its resources, particularly
    for both human researchers and automated systems. (b) Develop science foundation
    models and domain-specific models to enhance the underlying technology development
    and original innovation capabilities of AI for science and form modular and component-based
    applications that support secondary development (Moor et al., 2023). (c) Establish
    an open science cloud portal to provide scientific AI tools and intelligent agent
    services, research work space, and high-quality, integrated solutions and collaboration
    platforms for international big science research plans and projects as well as
    the global scientific community.The development of an open ecosystem and comprehensive
    infrastructure for AI for science could impact scientific advancement as much
    as the late 20th-century Information Superhighway initiative impacted the development
    of the internet. Once necessary infrastructure is in place, an AI "moonshot" will
    become possible (PCAST, 2024). The U.S. NAIRR pilot exemplifies this direction,
    demonstrating potential through lowering access barriers to computing resources
    and datasets. However, its pilot scale limits reach, and integrating specialized
    tools and ensuring sustainable funding remain hurdles, partly due to cross-agency
    coordination complexity. Considering economic efficiency and sustainable development,
    it will be prudent to refurbish and upgrade existing open science cloud platforms
    as well as build new ones. For example, the AI4EOSC project enhances services
    with artificial intelligence for the European Open Science Cloud, facilitating
    its transition into the AI-driven era of open science (Vollmer, 2025).Bottom-up
    initiatives: Popularizing open science across societyIn 2023, the White House
    Office of Science and Technology Policy launched the "Year of Open Science" in
    collaboration with federal agencies, universities, and other organizations. This
    initiative is a high-profile and high-impact effort, but the "Year of Open Science"
    raised awareness at top levels; sustained cultural change across society and grassroots
    research communities remains limited, hindered by its short duration and insufficient
    mechanisms for long-term embedding. Initiatives should therefore also focus on
    the regularity and continuity of the push for universal awareness of open science.
    Our recommendations are: (a) Advance popular science by encouraging scientists,
    AI experts, and science journalists to provide more and better popular science
    through websites, podcasts, and social media to effectively disseminate exemplary
    AI for science innovations and scientific achievements beyond academia and increase
    opportunities for public engagement (Fuentes, 2024). (b) Establish open courses
    covering spirits and practical knowledge of open science, fostering critical thinking
    and creativity to mitigate risks associated with overreliance on AI automation
    in innovation. (c) Promote the development of AI for science open-source communities
    like DeepModeling and the Generative Toolkit for Scientific Discovery, creating
    collaborative platforms for diverse disciplines and backgrounds to cultivate a
    collaborative, transparent, and inclusive open science culture. Ultimately, these
    bottom-up initiatives aim to make the transformative potential of scientific knowledge
    and AI tools accessible equitably across different races, ages, genders, and income
    levels and ensure that open science becomes a universal norm rather than an exception.
    Incentive policiesOur recommendations for incentive policies in industry are:
    (a) Conditionally open government-owned data repositories and international statistical
    databases (potentially involving enhanced privacy technologies and trusted research
    environments to improve access to sensitive data, or providing access through
    synthetic data methods). Similarly, high-quality scarce data from national laboratories,
    national large-scale scientific facilities, etc., could be opened for exchange,
    inviting reciprocal openness of private sector resources via central agreements
    to establish an open data network. (b) Provide incentives such as tax breaks,
    technology subsidies, and certification programs to guide industry participation
    in investment and development of AI for science infrastructure. (c) Promote collaboration
    between academia and industry by establishing national key R&D projects for AI
    for science, encouraging joint development of models and tools like AlphaFold
    (Jumper et al., 2021), GNoME (Merchant et al., 2023), GraphCast (Lam et al., 2023),
    with project proponents committing to open sharing of research outputs within
    AI for science infrastructure.Our recommendations for incentive policies in academia
    are: (a) Encourage universities and research institutes to integrate activities
    such as managing public datasets, constructing large pre-trained science models,
    and related initiatives into performance assessments and promotion criteria for
    researchers to reward and recognize contributions to open science. (b) Encourage
    employers to establish roles such as AI infrastructure engineers, data pipeline
    specialists, and data openness managers, to contribute to the professionalization
    of open science management in the era of AI.Governance policiesPolicy makers should
    systematically and comprehensively consider various dimensions of responsible
    artificial intelligence, such as reproducibility, interpretability, fairness,
    and transparency (Ahmed et al., 2023; Costes et al., 2024), in alignment with
    frameworks like the EU AI Act, when developing guidelines and regulatory principles
    for the AI era. Our recommendations are: (a) Promote open science practices in
    academic publishing by requiring open access to code, data, and computing environments
    (hardware, software, etc.) to address challenges of irreproducibility and ensure
    transparency in the research process or presentation of findings. (b) Prioritize
    methods to enhance model interpretability, such as integrating attention mechanisms,
    modular structures, and visualization tools, thereby improving reliability and
    transparency of models (Lam et al., 2023). (c) Emphasize the development of scientific
    benchmarks for evaluating large science models to provide a fair, open, and replicable
    standard for assessing model capabilities in scientific reasoning, knowledge extraction,
    and complex system simulations. Consider mandating industry to responsibly release
    model benchmarks, training data, validation procedures, etc., to prevent the development
    of closed ecosystems in the scientific domain. (d) Support the establishment of
    FAIR-aligned data pipeline standards to ensure data findability, accessibility,
    interoperability, and reusability throughout the research lifecycle, thereby mitigate
    issues like data bias, privacy breaches, and model hallucinations. This should
    be reinforced by national legislation mandating open access for publicly funded
    research data, exemplified by France’s Digital Republic Law (Loi République numérique).
    (e) Strengthen collaboration between AI experts, scientists, and social experts
    from legal, psychological, and public administration fields to study the interaction
    between open science and AI for science, explicitly addressing ethical risks such
    as algorithmic bias exacerbating scientific inequality and proprietary barriers
    impeding knowledge-sharing. This collaboration should minimize potential security
    and ethical risks while ensuring clear channels for public oversight.The novelty
    of our proposal lies in a pioneering "vertical-horizontal" dual-track framework
    for AI-driven open science, integrating: Vertical coherence bridging top-down
    AI infrastructure (e.g., NAIRR) with bottom-up cultural cultivation (e.g., open
    science initiatives); Horizontal synergy coupling incentive accelerators (tax
    benefits, data reciprocity) with governance stabilizers (refer to EU AI Act);
    Cross-layer permeation embedding FAIR principles throughout infrastructure/governance
    to resolve implementation gaps in cross-agency coordination, sustained adoption,
    and tool integration—strategically advancing EU Open Science Policy objectives.'
  venue: Frontiers in Research Metrics and Analytics
- title: Toward reproducibility. Making an Atlas run on your laptop
  date: 2025-10
  url: https://doi.org/10.5281/zenodo.18240221
  category: nix-devops
  subcategory: ''
  authors:
  - Goran Sterjov
  abstract: Abstract Making software reproducible is hard. Making an entire Atlas
    reproducible makes it even harder. At the Australian Reference Genome Atlas we
    ve wrestled with tools and technologies to do just that. From making our code
    run within a Nix environment, writing declarative schema migrations, importing
    data relying on eventual consistency, and using declarative infrastructure configurations
    on Kubernetes, we will detail tips and tricks as well as some significant and
    unexpected gains as a result of being a reproducible Atlas that can run on your
    laptop. Australian Reference Genome Atlas (ARGA) is an NCRIS-enabled platform,
    powered by Atlas of Living Australia (ALA), in collaboration with Bioplatforms
    Australia and Australian BioCommons, with Australian Research Data Commons (ARDC).
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Lila: Decentralized Build Reproducibility Monitoring for the Functional
    Package Management Model'
  date: 2026-01
  url: https://arxiv.org/abs/2601.20662
  category: nix-devops
  subcategory: ''
  authors:
  - Julien Malka
  - Arnout Engelen
  abstract: 'Ensuring the integrity of software build artifacts is an increasingly
    important concern for modern software engineering, driven by increasingly sophisticated
    attacks on build systems, distribution channels, and development infrastructures.
    Reproducible builds $\unicode{x2013}$ where binaries built independently from
    the same source code can be verified to be bit-for-bit identical to the distributed
    artifacts $\unicode{x2013}$ provide a principled foundation for transparency and
    trust in software distribution. Despite their potential, the large-scale adoption
    of reproducible builds faces two significant challenges: achieving high reproducibility
    rates across vast software collections and establishing reproducibility monitoring
    infrastructure that can operate at very large scale. While recent studies have
    shown that high reproducibility rates are achievable at scale $\unicode{x2013}$
    demonstrated by the Nix ecosystem achieving over 90% reproducibility on more than
    80,000 packages $\unicode{x2013}$ the problem of effective reproducibility monitoring
    remains largely unsolved. In this work, we address the reproducibility monitoring
    challenge by introducing Lila, a decentralized system for reproducibility assessment
    tailored to the functional package management model. Lila enables distributed
    reporting of build results and aggregation into a reproducibility database, benefiting
    both practitioners and future empirical build reproducibility studies.'
  venue: arXiv (Cornell University)
- title: SIMULATED AEROMEDICAL EVACUATION EXACERBATES ACUTE LUNG INJURY VIA HYPOXIA-INDUCIBLE
    FACTOR 1Α–MEDIATED BNIP3/NIX-DEPENDENT MITOPHAGY
  date: 2024-01
  url: https://doi.org/10.1097/shk.0000000000002306
  category: nix-development
  subcategory: ''
  authors:
  - Chunli Yin
  - Xinyang Liu
  - Yujie Ma
  abstract: 'ABSTRACT: Background: With the advancement of medicine and the development
    of technology, the limiting factors of aeromedical evacuation are gradually decreasing,
    and the scope of indications is expanding. However, the hypobaric and hypoxic
    environments experienced by critically ill patients in flight can cause lung injury,
    leading to inflammation and hypoxemia, which remains one of the few limiting factors
    for air medical evacuation. This study aimed to examine the mechanism of secondary
    lung injury in rat models of acute lung injury that simulate aeromedical evacuation.
    Methods: An acute lung injury model was induced in SD rats by the administration
    of lipopolysaccharide (LPS) followed by exposure to a simulated aeromedical evacuation
    environment (equivalent to 8,000 feet above sea level) or a normobaric normoxic
    environment for 4 h. The expression of hypoxia-inducible factor 1α (HIF-1α) was
    stabilized by pretreatment with dimethyloxalylglycine. The reactive oxygen species
    levels and the protein expression levels of HIF-1α, Bcl-2-interacting protein
    3 (BNIP3), and NIX in lung tissue were measured. Results: Simulated aeromedical
    evacuation exacerbated pathological damage to lung tissue and increased the release
    of inflammatory cytokines in serum as well as the reactive oxygen species levels
    and the protein levels of HIF-1α, BNIP3, and NIX in lung tissue. Pretreatment
    with dimethyloxalylglycine resulted in increases in the protein expression of
    HIF-1α, BNIP3, and NIX. Conclusion: Simulated aeromedical evacuation leads to
    secondary lung injury through mitophagy.'
  venue: Shock
- title: Antiretroviral Drugs Impact Autophagy Differently in Primary Human Astrocytes
  date: 2025-12
  url: https://doi.org/10.3390/cells14231904
  category: nix-development
  subcategory: ''
  authors:
  - Laura Cheney
  - Grace McDermott
  - Hillary Guzik
  abstract: While antiretroviral therapy (ART) has significantly improved the morbidity
    of HIV infection, ART may contribute to the pathogenesis of HIV associated neurocognitive
    impairment (HIV-NCI) by interfering with autophagic processes in astrocytes. Autophagy
    and mitophagy remove unwanted/damaged material and mitochondria from the intracellular
    environment, respectively. Dysregulated autophagy in astrocytes, abundant CNS
    cells with crucial homeostatic functions, contributes to many neurodegenerative
    diseases. Few studies have examined effects of ART on autophagy in astrocytes.
    We treated primary human astrocytes with a common ART regimen and performed LC3B-II
    and p62 turnover assays. ART significantly inhibited both LC3B-II and p62 turnover.
    Since p62, one autophagy receptor that mediates mitophagy, autophagic clearance
    of mitochondria, turnover was inhibited, we also examined mitophagy. While ART
    decreased BNIP3L/Nix homodimers, there were no changes in PINK1, Parkin, Mt-CO2,
    mitochondrial mass, or mitochondria-lysosome colocalization, indicating that ART
    did not inhibit mitophagy. We show that antiretroviral drugs have distinct effects
    on autophagic processes in astrocytes, which represents an alteration in their
    homeostasis, a major function of autophagy. This likely contributes to HIV-NCI.
    Understanding these impacts is important for improving ART for PWH, who have,
    by necessity, ongoing ART exposure. It also facilitates development of therapies
    for HIV-NCI that may include modulation of autophagy.
  venue: Cells
- title: 'Emotional literacy as curriculum: a new paradigm for resilient classrooms'
  date: 2025-06
  url: https://doi.org/10.3389/feduc.2025.1610746
  category: nix-development
  subcategory: ''
  authors:
  - Putra Jaya
  - Rinu V. Antony
  - Jeena Joseph
  abstract: 'The post-pandemic classroom has become an emotional battlefield. Educators
    report rising levels of anxiety, isolation, and burnout among students across
    age groups. Standardized tests, remote learning fatigue, and performance pressures
    have exposed the systemic gaps in how we address the emotional needs of learners
    (Yang, 2021). It is no longer enough to advocate for mental health support at
    the margins of the curriculum. We must reimagine emotional literacy not as an
    extracurricular benefit, but as the curriculum itself. This article argues that
    emotional literacy should be embedded across disciplines, ages, and assessments,
    shifting the paradigm from performance-based education to resilience-based learning.
    As educators, psychologists, and policymakers reflect on the purpose of education
    in the 21st century, a critical realization emerges: the ability to manage one''s
    emotions, collaborate empathetically, and persevere in the face of setbacks is
    not a "nice to have"-it is a necessity (Quílez-Robres et al., 2023;Nalipay et
    al., 2024;Savina et al., 2025). Emotional literacy is not just about emotional
    awareness; it is about survival, sustainability, and success in an unpredictable
    world (Zeidner, 2013). In the face of ecological crises, artificial intelligence,
    and socio-political instability, students need emotional tools as much as they
    need academic knowledge (Popa, 2024). Yet our systems continue to treat these
    tools as optional. This calls for an urgent and systemic shift in how we integrate
    emotional tools into educational practices.Although Social and Emotional Learning
    (SEL) frameworks have gained traction globally, most implementations remain fragmented-delivered
    as weekly modules, isolated programs, or reactive interventions rather than foundational
    curriculum components. Previous studies have explored SEL as an adjunct to academic
    learning (Newman and Dusenbury, 2015;Zieher et al., 2024), but few have argued
    for emotional literacy as the central curricular paradigm across all subjects,
    age levels, and assessments. This paper addresses that critical gap by proposing
    an integrated, cross-disciplinary model where emotional literacy is not a support
    system, but the structural core of educational practice. Furthermore, while existing
    literature focuses on SEL outcomes or teacher competencies, this article expands
    the discourse to include systemic reform, cultural responsiveness, family engagement,
    and global policy inspiration (e.g., Bhutan''s Gross National Happiness, UNESCO''s
    Happy Schools). It aims to reframe emotional literacy as a necessary and measurable
    academic standard-shifting the educational narrative from performance to resilience.The
    Case for Emotional Literacy in EducationOften treated as an adjunct to "real"
    academic content, emotional literacy has been mischaracterized as a soft skill-important,
    perhaps, but secondary. Such a dichotomy is not only inaccurate but potentially
    detrimental to educational outcomes. Emotional literacy, defined as the capacity
    to recognize, understand, express, and regulate emotions, is foundational to learning.
    While emotional literacy focuses on the ability to recognize, understand, express,
    and regulate emotions, it is often conflated with related terms such as Social
    Emotional Learning (SEL), emotional intelligence (EI), and emotional learning.
    Each has its own scope and purpose. SEL is a structured educational framework
    aimed at developing social and emotional skills through programs and curricula.
    Emotional intelligence refers to an individual''s capacity to manage emotions
    effectively and is often viewed as a measurable trait, especially in adult and
    professional contexts (Mayer et al., 2004). Emotional learning, meanwhile, is
    a broader process that encompasses both formal and informal ways we acquire emotional
    understanding (Immordino- Yang and Damasio, 2007). Emotional literacy stands apart
    in its emphasis on language, expression, and critical awareness of emotions within
    social and cultural contexts. It is foundational and ongoing, not tied to specific
    programs like SEL or assessments like EI. While SEL can provide the framework
    and EI the skillset, emotional literacy is the communicative and reflective process
    that underpins them both (Price, 2009). Recognizing these distinctions allows
    educators to more deliberately embed emotional literacy across disciplines and
    ensure it is not reduced to a onesize-fits-all model.Neuroscience affirms that
    emotional states directly impact cognitive processing, memory, and decision-making
    (Naqvi et al., 2006). Emotional regulation is a prerequisite for deep and sustained
    learning, as emotional disturbances hinder cognitive engagement. Consider a child
    facing test anxiety.No matter how well the material has been taught, that child''s
    ability to retrieve and apply knowledge is compromised by emotional overwhelm.
    Similarly, a student navigating family conflict may find it difficult to engage
    in collaborative tasks without tools for self-regulation or conflict resolution.
    Such experiences are not exceptions but have become routine challenges encountered
    in classrooms across the globe. By teaching emotional literacy as a cross-curricular
    competency, schools can equip students with the tools to manage stress, build
    relationships, and navigate conflict. Emotional literacy should be viewed not
    as an isolated program, but as a lens through which all content is taught and
    experienced.Although numerous schools have incorporated Social and Emotional Learning
    (SEL) frameworks, they are more frequently used as short weekly sessions or standalone
    modules, separated from the academic curriculum (Zieher et al., 2024). Teachers,
    also already stretched, are responsible for conveying content for which they are
    not adequately trained (Schiepe-Tiska et al., 2021). The consequence? SEL is a
    checkbox, not a transformative experience. In addition, most of these assessments
    still test rote memory, neglecting emotional intelligence altogether. This patchwork
    design sustains the notion that learning and feeling are distinct undertakings
    (Barłożek, 2014). In other instances, SEL is boiled down into scripted curricula,
    removing authenticity, turning emotional engagement into a mechanical task (Newman
    and Dusenbury, 2015). The problem lies not in the intent of SEL but in not treating
    it as a foundation. Without embedding social-emotional objectives into learning
    objectives, lesson planning, and school culture, SEL can never realize its full
    potential. It then exists as a side track, separate from the everyday rhythm of
    school.Resilience, often defined as the ability to adapt and thrive despite adversity,
    is deeply intertwined with emotional literacy. By cultivating emotional awareness,
    regulation, and empathy, students develop the inner strength to navigate stress,
    setbacks, and uncertainty-hallmarks of resilience. This aligns with core goals
    of Social and Emotional Learning (SEL), which research has shown to significantly
    improve students'' emotional well-being, academic performance, and long-term success
    (Newman and Dusenbury, 2015;Yang, 2021). Widely recognized SEL models, such as
    the CASEL (Collaborative for Academic, Social, and Emotional Learning) framework,
    emphasize five core competencies: selfawareness, self-management, social awareness,
    relationship skills, and responsible decision-making (Ross and Tolan, 2018). These
    competencies not only support academic learning but also foster resilience by
    equipping students with lifelong tools for emotional navigation and interpersonal
    effectiveness. Integrating such frameworks into daily classroom practices transforms
    SEL from isolated sessions into a cohesive strategy for building both emotional
    literacy and resilience.What would have integrated emotional literacy look like?
    In English class, students would not just analyze plot and character but also
    emotion arcs and empathy. They might write a journal entry from a character''s
    point of view in order to gain a better sense of emotional awareness. In math
    class, a study of frustration tolerance and problem-solving tenacity could be
    incorporated into every topic. How does a student feel when they become stuck
    on a problem? How do they get through it? Science courses might also involve explorations
    of ethical questions and the affective impact of discovery. Think in terms of
    the affective aspects of climate science-grief, hope, fear. Teachers might not
    sidestep these, but instead make room for them, in addition to developing critical
    thinking, also developing students'' affective strength (Nair and Bhandare, 2024).
    There''s a similar potential for physical education. There''s a natural platform
    in sports for affective regulation and empathy in teamwork. How students respond
    when losing, playing with less experienced teammates, or enduring frustration
    are rich fields of affective learning.Pedagogically, this calls for a shift from
    the transmission of content to design of experience. The classrooms must become
    fields of experimentation with emotion-places where failures are okay, selfknowledge
    is cultivated, and creativity is nurtured (Guinard and and Lanne, 2023). Project-based
    learning, reflective journaling, role-playing, and collaborative design challenges
    all can be employed as a means of integrating emotional exploration with intellectual
    rigor (Bolon et al., 2024). Teachers are not necessarily psychologists, but they
    do require a mindset shift: from a focus on control of behavior, in this sense,
    to a focus on awareness. Emotional check-ins, class norms of respect and compassion,
    and reflection prompts in assignments can all become part of a new pedagogy of
    emotion.For curricula to include emotional literacy, there must be systemic reform.
    Teacher training courses must espouse pedagogical competence in emotion alongside
    subject matter competence. Emotional awareness and regulation must be incorporated
    into teacher training, not achievement. There must be funding in environments-physical,
    as well as psychological-of belonging, safety, and openmindedness. Curriculum
    standards should include affective learning outcomes as concrete and quantifiable
    as academic ones (Nix et al., 2022). For instance, in addition to academic skills
    such as "examine a primary source," we can include "exercise empathy for diverse
    historical perspectives."The way we assess affective outcomes is through reflective
    writing, peer feedback, and observations of behavior-not grading the students,
    but informing student development.Models for UNESCO''s Happy Schools Project,
    for example, or for Bhutan''s Gross National Happiness curriculum, present us
    with visions for how emotionally responsive schooling can be scaled (Schuelka
    et al., 2019;Nam-Phuong Nguyen et al., 2022). What these models illustrate is
    that wellbeing is not a by-product of schooling but a purpose. Nations such as
    Finland, where schooling focuses on student agency, trust in teachers, and development
    of emotion, are demonstrating that academic achievement and well-being are not
    in tension with each other; they are reinforcing (Jääskelä et al., 2021). This
    change also demands a reframing of success. Rather than aiming solely for grades,
    schools should create comprehensive portraits of students-measuring emotional
    strengths, interpersonal development, and self-knowledge. Report cards may feature
    stories of a student''s perseverance, collaborative spirit, or taking charge of
    his or her own emotional growth. Bhutan''s GNH-based education system, on the
    other hand, embeds emotional, spiritual, and communal well-being into formal education.
    Teachers in Bhutan are trained not just in cognitive development but also in cultivating
    compassion, mindfulness, and resilience in students. Studies show that students
    under the GNH framework demonstrate improved attention, empathy, and collaboration-attributes
    directly linked to academic success (Schuelka et al., 2019). These models underscore
    that emotional literacy is not a trade-off with academic rigor but a catalyst
    for it. They validate the idea presented in paragraph four of our article, where
    integration of emotional awareness into disciplines such as English, math, and
    science results in richer, more engaged learning experiences. By equipping students
    with tools to navigate frustration, ethical dilemmas, and teamwork, these models
    exemplify how emotional development enhances not only social outcomes but also
    measurable academic progress.No discussion of emotional literacy in schools can
    take place without reference to families and the role they must be involved in.
    Emotional learning starts in the family and is influenced by social norms, cultural
    values, and child-rearing approaches (Gonzalez et al., 2023). Educators, therefore,
    need to work with families as allies-not merely through parent-teacher interviews
    but through workshops, channels of information, and community activities with
    a shared emotional vocabulary. Teachers should also be mindful of cultural difference
    in the expression of emotion (Kozina et al., n.d.). What is understood by one
    culture as emotional intelligence can be quite different in another. Emotional
    literacy needs to be culturally responsive, leaving enough space for diverse norms
    of emotion while maintaining a shared set of principles of empathy, respect, and
    self-regulation.Community groups, mental health experts, and even artists can
    contribute to emotionally rich learning.Collaborations among schools and outside
    stakeholders can introduce new tools, insights, and arenas for emotional exploration-whether
    in theater, peer mentoring, or storytelling sessions. One might contend that placing
    emphasis on emotional literacy could weaken academic standards. Conversely, studies
    demonstrate that safe spaces are most likely to support more in-depth learning,
    creativity, as well as academic achievement (Danial and Hidayatullah, 2024). Emotional
    intelligence is not a replacement for academic skills-it is where they flourish.
    Instead of replacing academic toughness, emotional literacy transforms it. It
    dispels the myth that achievement is a matter of speed, perfection, or compliance.
    It values the emotional process leading up to every success: the frustration before
    understanding, the bravery of questioning, the vulnerability of trying, then getting
    it wrong, and trying again. By integrating emotional literacy, disruptions in
    behavior, burnout among teachers, and absenteeism decrease-producing a better
    learning environment for everyone. The schools that invest in emotional education
    actually save time and funds in the long run. Research substantiates these claims.
    For example, a meta-analysis by Durlak et al. (2011), which involved more than
    270,000 students, reported that classroom behavior improved significantly, and
    conduct problems and academic achievement improved through Social and Emotional
    Learning (SEL) programs (Durlak et al., 2011). In a similar context, Jennings
    and Greenberg (2009) identified that supportive classroom climates facilitated
    by SEL decrease burnout and stress of teachers by enhancing student-teacher relationships
    and cooperative classrooms (Jennings and Greenberg, 2009). These findings underscore
    the transformative potential of emotional literacy not only for student outcomes
    but also for educator wellbeing.With climate anxiety, digital saturation, and
    global instability on the rise, today''s students urgently need a crucial literacy:
    resilience. This article contributes to the ongoing discourse by reframing emotional
    literacy not as an optional enrichment, but as the structural core of education.
    By advocating for its integration across disciplines, alignment with pedagogical
    practices, and inclusion in systemic reforms, the paper offers a new perspective
    on how emotional development can be central to educational success in the 21st
    century.The review emphasizes that emotional literacy should be recognized as
    an academic standard rather than a supplemental skill. It extends the conversation
    beyond traditional SEL frameworks by exploring how emotional literacy can be woven
    into subject-specific content, embedded in classroom culture, and supported through
    teacher training and institutional practices. Moreover, the article draws attention
    to often-overlooked dimensions such as culturally responsive approaches to emotional
    development and the essential role of family and community partnerships in fostering
    emotional well-being in students.These discussions open important pathways for
    future research. Further empirical studies are needed to examine how integrated
    models of emotional literacy operate in diverse educational settings, how educators
    can be effectively equipped to implement such models, and how educational policy
    can'
