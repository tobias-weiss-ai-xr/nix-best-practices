- title: USING FIREBASE STUDIO IN DEVELOPING REACT APPLICATIONS
  date: 2025-05
  url: https://doi.org/10.34132/mspc2025.01.14.14
  category: nix-development
  subcategory: ''
  authors:
  - Viktor Ralenko
  - Yevhenii Stoiev
  abstract: 'The theses focuses on Firebase Studio, Google’s cloud-based platform
    for building web and mobile applications, specifically based on React, announced
    on April 9, 2025. The platform addresses key development challenges: remote workspace
    availability, limited hardware, paid integration of AI services, and limited number
    of test devices. Firebase Studio supports importing projects with version control,
    offers templates for popular frameworks (React, Next.js, Angular, Flutter), rapid
    prototyping via Gemini with multimodal prompts, integration with Firebase and
    Google Cloud, and setting up an environment based on Code OSS with Nix support.
    The theses demonstrates building a React application with the People Data Generator
    API, highlighting the limitations in supporting third-party libraries such as
    Ant Design due to the experimental status of the platform. Firebase Studio has
    significant potential for expanding functionality, facilitating the development
    and testing of applications in the cloud, which increases the efficiency and scalability
    of projects.'
  venue: Scientific and Practical Journal "Materials of Scientific Conferences of
    the Petro Mohyla Black Sea National University"
